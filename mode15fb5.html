  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js",
        "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/"
      }
    }
  </script>
  <script type="module">
    import * as THREE from "../cdn.jsdelivr.net/npm/three%400.161.0/build/three.module.js";
    import { GLTFLoader } from "../cdn.jsdelivr.net/npm/three%400.161.0/examples/jsm/loaders/GLTFLoader.js";
    import { VRMUtils, VRMLoaderPlugin } from "../cdn.jsdelivr.net/npm/%40pixiv/three-vrm%402.0.6/lib/three-vrm.module.js";

    const canvas = document.getElementById("camVrmCanvas");
    const video = document.getElementById("camera");
    if (typeof window.__autoModeNoFaceDetect === "undefined") {
      window.__autoModeNoFaceDetect = false;
    }
    if (typeof window.__autoModeIdleAmount === "undefined") {
      window.__autoModeIdleAmount = 1;
    }
    if (typeof window.__autoModeIdleSpeed === "undefined") {
      window.__autoModeIdleSpeed = 1;
    }
    if (!canvas || !video) {
      window.VRMController = { enable: () => {}, resize: () => {}, load: () => {}, loadFile: () => {}, setPoseStrong: () => {}, setPoseAngle: () => {}, setExternalTalking: () => {} };
    } else {
      const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: false });
      const maxPixelRatio = 1.25;
      renderer.setPixelRatio(Math.min(maxPixelRatio, window.devicePixelRatio || 1));
      renderer.setClearColor(0x000000, 0);
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 100);
      camera.position.set(0, 1.4, 2.2);

      const light = new THREE.DirectionalLight(0xffffff, 1.2);
      light.position.set(1, 2, 3);
      scene.add(light);
      scene.add(new THREE.AmbientLight(0xffffff, 0.6));

      const loader = new GLTFLoader();
      loader.register((parser) => new VRMLoaderPlugin(parser));
      let currentVrm = null;
      let currentModel = null;
      let enabled = false;
      let vrmReady = false;
      let poseStrongOverride = null;
      let poseAngleOverride = null;

      function resize() {
        const w = canvas.clientWidth || 1;
        const h = canvas.clientHeight || 1;
        renderer.setSize(w, h, false);
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
      }

      function setBoneRotation(vrm, boneName, x, y, z) {
        const bone = vrm.humanoid?.getNormalizedBoneNode(boneName);
        if (!bone) return;
        bone.rotation.x = x;
        bone.rotation.y = y;
        bone.rotation.z = z;
      }

      function applyIdlePoseFromUpperZ(vrm, upperZ) {
        const baseUpper = 1.3;
        const strongUpper = 2.2;
        const t = Math.max(0, Math.min(1, (upperZ - baseUpper) / (strongUpper - baseUpper)));
        const lowerX = 0.35 + (0.9 - 0.35) * t;
        const lowerZ = 0.05 + (0.15 - 0.05) * t;
        const handZ = 0.05 + (0.1 - 0.05) * t;
        setBoneRotation(vrm, "leftUpperArm", 0, 0, upperZ);
        setBoneRotation(vrm, "rightUpperArm", 0, 0, -upperZ);
        setBoneRotation(vrm, "leftLowerArm", lowerX, 0, lowerZ);
        setBoneRotation(vrm, "rightLowerArm", lowerX, 0, -lowerZ);
        setBoneRotation(vrm, "leftHand", 0, 0, handZ);
        setBoneRotation(vrm, "rightHand", 0, 0, -handZ);
      }

      function applyIdlePose(vrm, strong = false) {
        // Arms slightly down and relaxed (stronger for some VRoid exports)
        const upperZ = typeof poseAngleOverride === "number" ? poseAngleOverride : (strong ? 2.2 : 1.3);
        applyIdlePoseFromUpperZ(vrm, upperZ);
      }

      function resolvePoseStrong(vrm) {
        if (typeof poseStrongOverride === "boolean") return poseStrongOverride;
        const vrmName = (vrm?.meta?.name || vrm?.meta?.title || "") + "";
        return /AvatarSample|AvatarSample_V|AvatarSample_R|VRoid/i.test(vrmName);
      }

      function applyPoseToCurrent(strong) {
        if (currentVrm) applyIdlePose(currentVrm, strong);
      }

      // Monotonic token: only the most recently *requested* load is applied, so
      // a slow default load can't clobber a user avatar requested right after
      // it (or vice-versa) just because it finished last.
      let loadSeq = 0;
      function loadVrm(url, revokeUrl = false) {
        const seq = ++loadSeq;
        loader.load(
          url,
          (gltf) => {
            if (seq !== loadSeq) { // superseded by a newer request — discard
              if (revokeUrl) { try { URL.revokeObjectURL(url); } catch (e) {} }
              return;
            }
            const vrm = gltf.userData.vrm;
            if (currentVrm) scene.remove(currentVrm.scene);
            if (currentModel) scene.remove(currentModel);
            currentVrm = null;
            currentModel = null;

            if (vrm) {
              VRMUtils.removeUnnecessaryVertices(gltf.scene);
              VRMUtils.removeUnnecessaryJoints(gltf.scene);
              currentVrm = vrm;
              VRMUtils.rotateVRM0(vrm);
              applyIdlePose(vrm, resolvePoseStrong(vrm));
              const box = new THREE.Box3().setFromObject(vrm.scene);
              const height = Math.max(0.001, box.max.y - box.min.y);
              const scale = (1.6 * 1.5) / height;
              vrm.scene.scale.setScalar(scale);
              const downOffset = 0.8;
              vrm.scene.position.y = -box.min.y * scale - downOffset;
              currentModel = vrm.scene;
              scene.add(vrm.scene);
            } else {
              // Fallback: render generic GLB (no VRM metadata)
              const box = new THREE.Box3().setFromObject(gltf.scene);
              const height = Math.max(0.001, box.max.y - box.min.y);
              const scale = (1.6 * 1.5) / height;
              gltf.scene.scale.setScalar(scale);
              const downOffset = 0.8;
              gltf.scene.position.y = -box.min.y * scale - downOffset;
              currentModel = gltf.scene;
              scene.add(gltf.scene);
              console.warn("Loaded GLB without VRM metadata. Facial tracking is disabled.");
            }

            vrmReady = true;
            if (enabled && video) video.style.opacity = "0";
            if (revokeUrl) URL.revokeObjectURL(url);
            try { window.dispatchEvent(new Event("vrm-ready-change")); } catch (e) { /* ignore */ }
          },
          undefined,
          (err) => {
            if (revokeUrl) { try { URL.revokeObjectURL(url); } catch (e) {} }
            if (seq !== loadSeq) return; // superseded — ignore its failure
            console.error("Failed to load VRM:", err);
            vrmReady = false;
            try { window.dispatchEvent(new Event("vrm-ready-change")); } catch (e) { /* ignore */ }
          }
        );
      }

      // Load the provided VRM
      loadVrm("vrm/vrm2.vrm");

      // Face tracking (head rotation)
      let headYaw = 0;
      let headPitch = 0;
      let headRoll = 0;
      let mouthOpen = 0;
      let blinkLeft = 0;
      let blinkRight = 0;
      let smile = 0;
      let externalTalking = false;
      let externalTalkPhase = 0;
      let autoBlinkNextAt = performance.now() + 1400;
      let autoBlinkStartedAt = 0;
      const autoBlinkDurationMs = 190;
      let autoIdlePhase = 0;
      let autoIdleLookYaw = 0;
      let autoIdleLookPitch = 0;
      let autoIdleLookNextAt = performance.now() + 1100;
      let faceMesh = null;

      function clamp01(val) {
        return Math.max(0, Math.min(1, val));
      }

      function lerp(a, b, t) {
        return a + (b - a) * t;
      }

      function dist(a, b) {
        const dx = a.x - b.x;
        const dy = a.y - b.y;
        return Math.hypot(dx, dy);
      }

      function updateHeadFromLandmarks(landmarks) {
        if (window.__autoModeNoFaceDetect) return;
        if (!landmarks || !landmarks.length) return;
        const leftEye = landmarks[33];
        const rightEye = landmarks[263];
        const nose = landmarks[1];
        const eyeMidX = (leftEye.x + rightEye.x) * 0.5;
        const eyeMidY = (leftEye.y + rightEye.y) * 0.5;
        headYaw = (nose.x - eyeMidX) * -3.0;
        headPitch = (nose.y - eyeMidY) * 2.5;
        headRoll = Math.atan2(rightEye.y - leftEye.y, rightEye.x - leftEye.x) * -1.0;

        // Mouth open (inner lips)
        const mouthTop = landmarks[13];
        const mouthBottom = landmarks[14];
        const mouthLeft = landmarks[61];
        const mouthRight = landmarks[291];
        const mouthOpenRaw = dist(mouthTop, mouthBottom) / Math.max(0.001, dist(mouthLeft, mouthRight));
        const mouthOpenTarget = clamp01((mouthOpenRaw - 0.02) * 8.0);

        // Smile (mouth width vs height)
        const smileRaw = dist(mouthLeft, mouthRight) / Math.max(0.001, dist(mouthTop, mouthBottom));
        const smileTarget = clamp01((smileRaw - 2.0) * 0.5);

        // Eye blink
        const leftEyeTop = landmarks[159];
        const leftEyeBottom = landmarks[145];
        const leftEyeOuter = landmarks[33];
        const leftEyeInner = landmarks[133];
        const rightEyeTop = landmarks[386];
        const rightEyeBottom = landmarks[374];
        const rightEyeOuter = landmarks[362];
        const rightEyeInner = landmarks[263];

        const leftEyeOpen = dist(leftEyeTop, leftEyeBottom) / Math.max(0.001, dist(leftEyeOuter, leftEyeInner));
        const rightEyeOpen = dist(rightEyeTop, rightEyeBottom) / Math.max(0.001, dist(rightEyeOuter, rightEyeInner));
        const leftBlinkTarget = clamp01(1.0 - (leftEyeOpen - 0.15) * 6.0);
        const rightBlinkTarget = clamp01(1.0 - (rightEyeOpen - 0.15) * 6.0);

        // Smooth values
        mouthOpen = lerp(mouthOpen, mouthOpenTarget, 0.35);
        smile = lerp(smile, smileTarget, 0.25);
        blinkLeft = lerp(blinkLeft, leftBlinkTarget, 0.5);
        blinkRight = lerp(blinkRight, rightBlinkTarget, 0.5);
      }

      function initFaceMesh() {
        if (faceMesh || typeof FaceMesh === "undefined") return;
        faceMesh = new FaceMesh({
          locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4/${file}`,
        });
        faceMesh.setOptions({
          maxNumFaces: 1,
          refineLandmarks: false,
          minDetectionConfidence: 0.5,
          minTrackingConfidence: 0.5,
        });
        faceMesh.onResults((results) => {
          if (results.multiFaceLandmarks && results.multiFaceLandmarks[0]) {
            updateHeadFromLandmarks(results.multiFaceLandmarks[0]);
          }
        });
      }

      async function faceLoop() {
        if (!enabled || !faceMesh) return;
        if (!window.__autoModeNoFaceDetect && video.readyState >= 2) {
          try { await faceMesh.send({ image: video }); } catch (e) { /* ignore */ }
        }
        requestAnimationFrame(faceLoop);
      }

      function getAutoBlinkValue(nowMs) {
        if (nowMs >= autoBlinkNextAt) {
          autoBlinkStartedAt = nowMs;
          autoBlinkNextAt = nowMs + 2000 + Math.random() * 2600;
        }
        if (!autoBlinkStartedAt) return 0;
        const elapsed = nowMs - autoBlinkStartedAt;
        if (elapsed >= autoBlinkDurationMs) {
          autoBlinkStartedAt = 0;
          return 0;
        }
        const p = Math.max(0, Math.min(1, elapsed / autoBlinkDurationMs));
        return p < 0.5 ? (p * 2) : ((1 - p) * 2);
      }

      function getAutoIdleHead(nowMs) {
        const idleAmount = Math.min(2.5, Math.max(0.3, Number(window.__autoModeIdleAmount) || 1));
        const idleSpeed = Math.min(2.5, Math.max(0.5, Number(window.__autoModeIdleSpeed) || 1));
        if (nowMs >= autoIdleLookNextAt) {
          // Small random glances to avoid a frozen stare.
          autoIdleLookYaw = (Math.random() * 2 - 1) * 0.08 * idleAmount;
          autoIdleLookPitch = (Math.random() * 2 - 1) * 0.04 * idleAmount;
          autoIdleLookNextAt = nowMs + (1200 + Math.random() * 2000) / idleSpeed;
        }
        autoIdlePhase += 0.03 * idleSpeed;
        const waveYaw = (Math.sin(autoIdlePhase * 0.95) * 0.03 + Math.sin(autoIdlePhase * 0.31) * 0.015) * idleAmount;
        const wavePitch = Math.sin(autoIdlePhase * 0.8) * 0.014 * idleAmount;
        const waveRoll = Math.sin(autoIdlePhase * 0.6) * 0.018 * idleAmount;
        return {
          yaw: autoIdleLookYaw + waveYaw,
          pitch: autoIdleLookPitch + wavePitch,
          roll: waveRoll,
        };
      }

      let lastRenderTime = 0;
      const targetFrameMs = 33;
      function render() {
        requestAnimationFrame(render);
        const now = performance.now();
        if (now - lastRenderTime < targetFrameMs) return;
        lastRenderTime = now;
        if (!enabled || !currentModel) return;
        if (window.__autoModeNoFaceDetect) {
          const idleHead = getAutoIdleHead(now);
          headYaw = lerp(headYaw, idleHead.yaw, 0.16);
          headPitch = lerp(headPitch, idleHead.pitch, 0.14);
          headRoll = lerp(headRoll, idleHead.roll, 0.14);
          mouthOpen = lerp(mouthOpen, 0, 0.2);
          smile = lerp(smile, 0.08, 0.1);
          const autoBlink = getAutoBlinkValue(now);
          blinkLeft = lerp(blinkLeft, autoBlink, 0.65);
          blinkRight = lerp(blinkRight, autoBlink, 0.65);
        }
        if (currentVrm) {
          const head = currentVrm.humanoid?.getNormalizedBoneNode("head");
          if (head) {
            head.rotation.y = headYaw;
            head.rotation.x = headPitch;
            head.rotation.z = headRoll;
          }
          const expr = currentVrm.expressionManager || currentVrm.blendShapeProxy;
          if (expr) {
            if (externalTalking) {
              externalTalkPhase += 0.32;
            }
            const externalMouth = externalTalking ? (0.3 + (Math.sin(externalTalkPhase) * 0.25 + 0.25)) : 0;
            const mouthVal = Math.max(mouthOpen, externalMouth);
            expr.setValue("aa", mouthVal);
            if (typeof expr.setValue === "function") {
              try { expr.setValue("a", mouthVal); } catch(e) {}
            }
            expr.setValue("blinkLeft", blinkLeft);
            expr.setValue("blinkRight", blinkRight);
            expr.setValue("happy", smile);
          }
          currentVrm.update(1 / 60);
        }
        renderer.render(scene, camera);
      }

      render();

      window.VRMController = {
        enable(next) {
          enabled = !!next;
          canvas.style.display = enabled ? "block" : "none";
          if (video) video.style.opacity = enabled && vrmReady ? "0" : "1";

    if ('serviceWorker' in navigator) {
      // Unregister ALL old SW registrations first
      navigator.serviceWorker.getRegistrations().then(function(regs) {
        regs.forEach(function(r) { r.unregister(); });
      });

      navigator.serviceWorker.register('sw.js').catch(function() {});

    /* ── Single-instance guard: only one Mode 1 tab allowed ── */
    (function() {
      const CHANNEL_NAME = 'mode1-single-instance';
      const instanceId = Date.now() + '-' + Math.random().toString(36).slice(2);
      const singleCh = new BroadcastChannel(CHANNEL_NAME);

      // Tell any existing Mode 1 tab to close
      singleCh.postMessage({ type: 'takeover', id: instanceId });

      singleCh.addEventListener('message', (e) => {
        if (e.data && e.data.type === 'takeover' && e.data.id !== instanceId) {
          // A newer Mode 1 tab opened – close this one
          singleCh.close();
          window.location.replace('portal.html');
        }
      });
    })();

    let wsRoomId = null; // current room id (the WebSocket itself lives in App.bus)
    let layoutKey = "default";
    let camBgKey = "default:cam-bg";
    let webBgKey = "default:web-bg";
    let camBgLoadedFromServer = false;
    let webBgLoadedFromServer = false;
    const authPollMs = 15000;
    let authPollTimer = null;
    let authRedirecting = false;

    function redirectToPortal() {
      if (authRedirecting) return;
      authRedirecting = true;
      if (authPollTimer) {
        clearInterval(authPollTimer);
        authPollTimer = null;
      }
      App.bus.closeWs();
      window.location.replace('portal.html');
    }

    // Cache the last successful auth payload so a transient DB hiccup never
    // leaves the user on a black screen. If /api/auth/status fails after
    // retries we fall back to the cached user info and keep the page usable.
    const AUTH_CACHE_KEY = 'tiktok-auth-status-cache:v1';
    function readAuthCache() {
      try {
        const raw = sessionStorage.getItem(AUTH_CACHE_KEY) || localStorage.getItem(AUTH_CACHE_KEY);
        if (!raw) return null;
        const parsed = JSON.parse(raw);
        if (!parsed || !parsed.authenticated || !parsed.user) return null;
        return parsed;
      } catch (err) {
        return null;
      }
    }
    function writeAuthCache(data) {
      try {
        const payload = JSON.stringify(data);
        sessionStorage.setItem(AUTH_CACHE_KEY, payload);
        localStorage.setItem(AUTH_CACHE_KEY, payload);
      } catch (err) {
        // ignore
      }
    }

    async function checkAuthStatus({ retries = 3, retryDelayMs = 800 } = {}) {
      let lastError = null;
      for (let attempt = 0; attempt <= retries; attempt++) {
        try {
          const res = await fetch('/api/auth/status', { credentials: 'include' });
          // 429 = rate-limited (not an auth failure) — skip this poll cycle
          if (res.status === 429) return null;
          // Transient server errors (5xx) — retry instead of giving up
          if (res.status >= 500 && attempt < retries) {
            await new Promise((r) => setTimeout(r, retryDelayMs * (attempt + 1)));
            continue;
          }
          const data = await res.json();
          if (!res.ok || !data.authenticated) {
            redirectToPortal();
            return null;
          }
          writeAuthCache(data);
          return data;
        } catch (err) {
          // Network error / fetch failed (DB pool exhausted, server hiccup).
          // Retry with backoff instead of returning null silently — that path
          // used to leave the page on a black screen with no layout loaded.
          lastError = err;
          if (attempt < retries) {
            await new Promise((r) => setTimeout(r, retryDelayMs * (attempt + 1)));
            continue;
          }
        }
      }
      console.error('checkAuthStatus failed after retries:', lastError);
      return null;
    }

    function startAuthPolling() {
      /* Account-lifetime poll. The old 15s poll was removed because ANY
         failure (network hiccup, 5xx, rate-limit) bounced the live screen.
         This version only acts on a DEFINITIVE server verdict — the /status
         endpoint returns an explicit reason ('expired', 'account-disabled',
         'device-evicted') with authenticated:false once it has verified the
         user record. Transient errors keep the page alive, exactly like
         requireLogin()'s fallback. 60s cadence is plenty: an expired account
         is enforced at login anyway; this only ends sessions already running. */
      if (authPollTimer) clearInterval(authPollTimer);
      authPollTimer = setInterval(async () => {
        try {
          const res = await fetch('/api/auth/status', { credentials: 'include' });
          if (!res.ok) return; // 5xx/429 → transient, stay live
          const data = await res.json();
          if (data && data.authenticated === false &&
              (data.reason === 'expired' || data.reason === 'account-disabled' || data.reason === 'device-evicted')) {
            redirectToPortal();
          }
        } catch (err) { /* offline — stay live */ }
      }, 60000);
    }

    function getDisplayNameStorageKey(username) {
      return `tiktok-display-name:${String(username || 'default').toLowerCase()}`;
    }

    function getStoredDisplayName(username) {
      try {
        const value = localStorage.getItem(getDisplayNameStorageKey(username));
        return (value || '').trim() || 'Host';
      } catch (err) {
        return 'Host';
      }
    }

    /* WebSocket transport delegates to js/messaging.js (window.App.bus). */
    function connectWs(roomId) {
      App.bus.connectWs(roomId);
      /* Claim the single mode1 screen for this user. Sent repeatedly: the
         first send lands once the socket opens, and after any auto-reconnect
         the new socket re-claims (kicking any mode1 that took the room in
         between). The server only ever kicks connections that claimed mode1 —
         mode2 shares this room and is never touched. */
      if (!window.__mode1ClaimTimer) {
        const claim = () => App.bus.sendWs({ type: "__mode1_claim" });
        claim();
        window.__mode1ClaimTimer = setInterval(claim, 15000);
      }
    }
    function sendWs(message) { App.bus.sendWs(message); }

    async function requireLogin() {
      try {
        let data = await checkAuthStatus();
        if (!data) {
          // DB / network hiccup. Fall back to the last cached auth payload so
          // the user is NEVER bounced to portal or left on a black screen.
          // The WebSocket upgrade is still session-gated server-side, so this
          // is safe — if the session really is invalid the WS will just close.
          const cached = readAuthCache();
          if (!cached) {
            // No cache at all (first ever load that failed). Retry forever in
            // the background instead of redirecting so the page stays open.
            console.warn('Auth status unavailable and no cache; retrying in background');
            (async function keepTrying() {
              while (!data) {
                await new Promise((r) => setTimeout(r, 5000));
                data = await checkAuthStatus({ retries: 1, retryDelayMs: 500 });
              }
              // First successful response — reload to bootstrap cleanly.
              window.location.reload();
            })();
            return;
          }
          console.warn('Auth status fetch failed; using cached user info');
          data = cached;
        }
        // Make Video-only restriction: this user may not use Mode 1 (Host).
        if (data.user?.role !== 'admin' && Boolean(data.user?.makeVideoOnly)) {
          alert('Your account is limited to Make Video. Mode 1 is not available.');
          window.location.href = 'portal.html';
          return;
        }
        wsRoomId = data.user?.username || null;
        layoutKey = wsRoomId || "default";
        camBgKey = `${layoutKey}:cam-bg`;
        webBgKey = `${layoutKey}:web-bg`;
        const camNamePill = document.getElementById("camNamePill");
        if (camNamePill) {
          camNamePill.textContent = (getStoredDisplayName(wsRoomId) || "").trim() || "Host";
        }
        connectWs(wsRoomId);
        // Reload layout for this user after login
        loadLayoutFromServer().then((loaded) => {
          if (loaded) {
            applyRoomStyle();
            updateRoomUI(roomOpen);
          }
          /* loadLayoutFromServer restores saved decorations inside a
             setTimeout(0), so give that a moment to land — otherwise this sees
             an empty layer and adds the notice on top of a layout that already
             has its own. */
          setTimeout(ensureDefaultDecorBanner, 50);
        });

        // then fall back to a legacy server-saved bg, then the default video.

          camBgLoadedFromServer = true;
          if (restoredLocal) return;

            if (bg === CAM_BG_NONE) setCamBackground(CAM_BG_NONE, { persist: false }); // host removed bg → live camera, no default
            else if (bg) setCamBackground(bg, { persist: false });
            else applyDefaultCamBgVideo();

        });
        // Reload web background for this user after login
        restoreWebBgFromLocal().then((restoredLocal) => {
          webBgLoadedFromServer = true;
          if (restoredLocal) return;   // this device's own choice wins
          loadWebBgFromServer().then((bg) => {
            if (bg) setWebBackground(bg, false); // legacy copy; don't persist again

        // Warm gifts in the BACKGROUND immediately (as before) so animations
        // always play regardless of the chooser; the chooser is supplementary
        // (CPU/GPU choice + progress readout).
        preloadGiftAssets();
        prefetchGiftFragments();
        showRenderChooser();
        startAuthPolling();
      } catch (err) {
        redirectToPortal();
      }
    }

    /* ── Custom gift animations (added from mode2's Donate Gift Menu) ──────
       Merge into the gift lookups so .pag or video URLs the user adds
       remotely can be donated and played here. Persisted so they survive a
       host reload even before mode2 re-syncs the catalog. */
    const customGiftLibrary = {}; // giftId -> { id, sources[], sound, coins, name, icon }
    const CUSTOM_GIFT_STORE_KEY = "tiktok-custom-gift-catalog";
    function registerCustomGifts(list, persist) {
      if (!Array.isArray(list)) return;
      for (const g of list) {
        if (!g || !g.id) continue;
        const sources = Array.isArray(g.sources) && g.sources.length
          ? g.sources.slice()
          : (g.animation ? [g.animation] : []);
        if (!sources.length) continue;
        customGiftLibrary[g.id] = {
          id: g.id,
          sources,
          sound: g.sound || "",
          coins: Number(g.coins) || 0,
          name: g.name || g.id,
          icon: g.img || g.icon || "",
        };
      }
      if (persist) {
        try { localStorage.setItem(CUSTOM_GIFT_STORE_KEY, JSON.stringify(Object.values(customGiftLibrary))); } catch (e) { /* ignore */ }

    function showLiveGiftFirework(donorAvatar, giftIcon) {
      if (!liveFirework) return;
      const avatarSrc = donorAvatar || resolveAssetUrl("image/tiktokicon.png");
      const giftSrc = giftIcon ? resolveAssetUrl(giftIcon) : resolveAssetUrl("image/tiktokicon.png");
      const timing = liveFireworkTiming;
      const originX = Math.round((Math.random() - 0.5) * 180);
      const originY = Math.round((Math.random() - 0.5) * 110);
      liveFirework.classList.remove("show", "center-hidden");
      liveFirework.innerHTML = "";
      liveFirework.style.setProperty("--origin-x", `${originX}px`);
      liveFirework.style.setProperty("--origin-y", `${originY}px`);

      const core = document.createElement("div");
      core.className = "live-firework-core";
      const avatar = document.createElement("img");
      avatar.className = "live-firework-avatar";
      avatar.src = avatarSrc;
      avatar.alt = "Donor";
      const gift = document.createElement("img");
      gift.className = "live-firework-gift";
      gift.src = giftSrc;
      gift.alt = "Gift";
      core.append(avatar, gift);
      core.style.animationDuration = `${timing.flightMs}ms`;
      liveFirework.appendChild(core);

      const burstOffsets = [
        [110, 0], [-110, 0], [0, 110], [0, -110],
        [78, 78], [78, -78], [-78, 78], [-78, -78],
      ];

      const waves = [
        { delay: timing.firstBurstDelayMs, mult: 0.72 },
        { delay: timing.firstBurstDelayMs + timing.waveGapMs, mult: 0.92 },
        { delay: timing.firstBurstDelayMs + timing.waveGapMs * 2, mult: 1.12 },
      ];
      waves.forEach((wave, waveIdx) => {
        const particleSrc = waveIdx % 2 === 0 ? giftSrc : avatarSrc;
        const angleJitter = (Math.random() * 360) * (Math.PI / 180);
        const cosA = Math.cos(angleJitter);
        const sinA = Math.sin(angleJitter);
        burstOffsets.forEach(([x, y], idx) => {
          const b = document.createElement("img");
          b.className = "live-firework-burst";
          b.src = particleSrc;
          b.alt = "";
          const rx = x * cosA - y * sinA;
          const ry = x * sinA + y * cosA;
          b.style.setProperty("--fx", `${Math.round(rx * wave.mult)}px`);
          b.style.setProperty("--fy", `${Math.round(ry * wave.mult)}px`);
          b.style.setProperty("--delay", `${wave.delay + (idx % 2) * 20}ms`);
          b.style.animationDuration = `${timing.burstMs}ms`;
          liveFirework.appendChild(b);
        });
      });

      liveFirework.classList.add("show");
      setTimeout(() => {
        liveFirework.classList.add("center-hidden");
      }, Math.max(0, timing.firstBurstDelayMs - 80));
      liveFireworkTimer = setTimeout(() => {
        liveFirework.classList.remove("show", "center-hidden");
        liveFirework.innerHTML = "";
        liveFireworkActive = false;
        runNextLiveFirework();
      }, timing.cleanupDelayMs);
    }

    function enqueueGiftAnimation(giftId, seatIndex, receivedProfile) {
      if (!giftId) return;
      const si = seatIndex != null ? seatIndex : -1;
      /* Safety: if giftIsPlaying has been stuck for >90s, force-reset */
      /* 90s allows long premium animations (lion upgrade ~60s) to complete */
      if (giftIsPlaying && Date.now() - giftPlayStart > 90000) {
        console.warn("enqueueGiftAnimation: giftIsPlaying stuck for >90s, force-resetting");
        giftIsPlaying = false;
        giftPlayingSeatIndex = -1;
        giftPlaySeq++;
        if (giftHideTimer) { clearTimeout(giftHideTimer); giftHideTimer = null; }
        try { if (giftOverlay) { giftOverlay.classList.remove("show", "lion-upgrade", "android-lion"); } } catch(e) {}
      }
      /* If a different seat donated, clear old seat's queued animations (but let current finish) */
      if (giftIsPlaying && si >= 0 && giftPlayingSeatIndex >= 0 && si !== giftPlayingSeatIndex) {
        /* Purge old seat's queued animations - current animation continues playing */
        for (let q = giftQueue.length - 1; q >= 0; q--) {
          if (giftQueue[q].seatIndex === giftPlayingSeatIndex) giftQueue.splice(q, 1);
        }
      }
      /* Cap the queue to prevent unbounded growth */
      if (giftQueue.length >= 8) giftQueue.shift();
      giftQueue.push({ giftId, seatIndex: si, receivedProfile: receivedProfile || null });
      if (!giftIsPlaying) {
        const nextGift = giftQueue.shift();
        if (nextGift) playGiftAnimation(nextGift.giftId, nextGift.seatIndex, nextGift.receivedProfile);
      }
    }

    /* ── WebGL side-by-side alpha-matte compositor ───────────────────────────
       Recombines a TikTok "side-by-side" gift frame (left half = premultiplied
       colour, right half = luma matte) into a straight-alpha cut-out entirely
       on the GPU. This replaces the CPU getImageData + per-pixel JS loop that
       made these gifts stutter in Chrome/Electron on Windows — the GPU→CPU
       readback (getImageData over the full 1440×1280 frame every frame) is the
       slow part there; on Mac it was cheap, which is why it looked "smooth on
       Mac but laggy on PC" for the SAME gift. The pixel math is identical to the
       CPU path (un-premultiply, CUT/SPREAD, dark-edge suppression for hard
       silhouettes, fade envelope) and it bakes the SAME invisible per-account
       green-channel watermark via a texture. Throws on setup failure so the
       caller can fall back to the CPU path on a fresh canvas. */

         default, which shifts the RGB and is the reason the GPU matte looked
         "broken colours" on iPhone. Disable it there so the shader sees the raw
         decoded pixels. Left at the browser default on desktop (works already). */

        "void main(){ vUv = aPos * 0.5 + 0.5; gl_Position = vec4(aPos, 0.0, 1.0); }"
      ].join("\n");

         (LUMINANCE, value = delta+128) sampled at the output pixel. */
      const fsrc = [
        "precision highp float;",
        "varying vec2 vUv;",
        "uniform sampler2D uTex;",
        "uniform sampler2D uWm;",
        "uniform float uCut;",
        "uniform float uSpread;",
        "uniform float uEnv;",
        "uniform float uSoft;",
        "void main(){",
        "  vec3 col = texture2D(uTex, vec2(vUv.x * 0.5, vUv.y)).rgb;",        // left half = colour
        "  vec3 msk = texture2D(uTex, vec2(vUv.x * 0.5 + 0.5, vUv.y)).rgb;",  // right half = matte
        "  float a = dot(msk, vec3(0.299, 0.587, 0.114)) * 255.0;",
        "  if (a < uCut) { gl_FragColor = vec4(0.0); return; }",              // bg / noise → transparent

        "  float outA = (a - uCut) * uSpread;",
        "  if (uSoft < 0.5 && outA < 235.0) {",                              // hard silhouette: kill dark see-through edges
        "    float luma = dot(straight, vec3(0.299, 0.587, 0.114)) * 255.0;",
        "    outA *= clamp((luma - 70.0) / 80.0, 0.0, 1.0);",
        "  }",
        "  float alpha = clamp((outA / 255.0) * uEnv, 0.0, 1.0);",
        "  float wm = texture2D(uWm, vec2(vUv.x, 1.0 - vUv.y)).r * 255.0 - 128.0;",

            giftVideo.play().then(() => {
              if (seq !== giftPlaySeq) return;
              console.log("Video playing (muted)");
              if (giftVideo) giftVideo.classList.add("playing");
              try { if (giftVideo) giftVideo.removeAttribute("src"); } catch(e) {}
              startHideTimer();
            }).catch((err2) => {
              console.error("Play completely failed:", err2);
              if (freezeWatchdogId) clearInterval(freezeWatchdogId);
              tryNext();
            });
          });
        };

        giftVideo.addEventListener("canplaythrough", attemptPlay, { once: true });
        // Also listen for canplay as fallback
        giftVideo.addEventListener("canplay", () => {
          setTimeout(attemptPlay, 50);
        }, { once: true });
        // Fallback timeout — if nothing happens in 4s, force play
        setTimeout(attemptPlay, 4000);
      };

      tryNext();
    }

       Saves the blob in IDB (keyed by the seat's handle) so it survives
       reload, creates a Blob URL, persists `seats` and re-applies styles. */
    async function handleSeatVideoUpload(idx, file) {
      if (!file || !file.type || !file.type.startsWith("video/")) return;
      const seat = seats[idx];
      if (!seat) return;
      const handle = normalizeHandle(seat.handle || seat.name || "");
      if (!handle) return;
      try {
        await saveSeatVideoBlob(handle, file);
      } catch (err) {
        console.warn("Seat video save failed", err);

      // Revoke any previous URL for this handle before allocating a new one
      if (seatVideoBlobUrls.has(handle)) {
        try { URL.revokeObjectURL(seatVideoBlobUrls.get(handle)); } catch (err) { /* ignore */ }
      }
      seatVideoBlobUrls.set(handle, URL.createObjectURL(file));
      seat.videoMode = true;
      // Mark as user-uploaded; do NOT overwrite seat.videoSrc so the default
      // path (e.g. savetik.MP4) is preserved as a fallback if IDB is cleared
      try { localStorage.setItem(seatsStoreKey, JSON.stringify(seats)); } catch (err) { /* ignore */ }
      applyRoomStyle();
    }

    function formatSeatPoints(value) {
      const num = Number(value);

      if (pointsFormat === "full") {

      const abs = Math.abs(num);

    const seatProfileCache = new Map();
    const seatProfileInFlight = new Set();
    /* Avatar-less lookups are retried instead of being cached forever: an early
       failure (server WAF-blocked, worker slow) used to poison seatProfileCache
       with {avatar:""}, and because the read path only checked `.has(handle)`
       the seat could never recover for the life of the page — mode2 showed the
       profile while mode1 stayed blank. Retries are bounded + backed off so
       repeated renders cannot spam the endpoint. */
    const seatProfileRetry = new Map(); // handle -> { tries, nextAt }
    const SEAT_PROFILE_MAX_TRIES = 4;
    const SEAT_PROFILE_BACKOFF_MS = 15000;

    function seatProfileCanRetry(handle) {
      const r = seatProfileRetry.get(handle);
      if (!r) return true;
      return r.tries < SEAT_PROFILE_MAX_TRIES && Date.now() >= r.nextAt;
    }

    function normalizeHandle(raw) {
      if (!raw) return "";
      return raw.trim().replace(/^@+/, "");
    }

    async function fetchSeatProfile(handle, idx) {
      const clean = normalizeHandle(handle);
      if (!clean || seatProfileInFlight.has(clean)) return;
      seatProfileInFlight.add(clean);
      try {
        const res = await fetch(`/api/tiktok/profile/${encodeURIComponent(clean)}`);
        if (!res.ok) return;
        const body = await res.json();
        const data = body?.data || body?.profile || body;
        if (!data) return;
        let avatar = data.avatar || data.avatarLarger || data.avatarThumb || "";
        let name = data.nickname || data.displayName || data.username || clean;
        // Browser-side fallback: when the server is WAF-blocked (datacenter IP)
        // it returns an empty avatar. Resolve from THIS customer's residential
        // IP via CORS-proxied TikTok oEmbed; the helper POSTs the result back
        // to seed the shared server cache for all customers.
        let avatarIsPlaceholder = false;
        if (!avatar && window.ClientProfileFallback) {
          try {
            const fb = await ClientProfileFallback.resolveProfile(clean);
            if (fb && fb.avatar) {
              avatar = fb.avatar;
              // A `generated` avatar is just the initial-letter placeholder, not
              // the real picture — show it meanwhile, but keep retrying so the
              // real image replaces it instead of sticking forever.
              avatarIsPlaceholder = !!fb.generated;
              if (fb.name) name = fb.name;
            }
          } catch (e) { /* best-effort */ }
        }
        // Only treat a result WITH an avatar as final. A name-only result is
        // still cached (so the seat shows the real display name) but is left
        // retryable so the avatar can arrive on a later attempt.
        seatProfileCache.set(clean, { avatar, name, placeholder: avatarIsPlaceholder });
        if (avatar && !avatarIsPlaceholder) {
          seatProfileRetry.delete(clean);
        } else {
          const prev = seatProfileRetry.get(clean) || { tries: 0 };
          seatProfileRetry.set(clean, { tries: prev.tries + 1, nextAt: Date.now() + SEAT_PROFILE_BACKOFF_MS });
        }
        if (seats[idx]) {
          seats[idx].avatar = avatar || seats[idx].avatar || "";
          seats[idx].name = name || seats[idx].name || seats[idx].handle || "";
          applyRoomStyle();
        }
      } catch (err) { /* ignore */ }
      finally { seatProfileInFlight.delete(clean); }
    }

    /* ── Custom uploaded fonts ────────────────────────────────────────────
       Fonts uploaded in Mode 2 ride along in roomStyle.customFonts as
       { name, dataUrl } (base64). Register each with the FontFace API so the
       name becomes usable as a normal font-family for seats / request text. */
    const _registeredCustomFonts = new Set();
    function registerCustomFonts(list) {
      if (!Array.isArray(list) || !window.FontFace || !document.fonts) return;
      list.forEach((f) => {
        if (!f || !f.name || !f.dataUrl || _registeredCustomFonts.has(f.name)) return;
        try {
          const face = new FontFace(f.name, `url(${f.dataUrl})`);
          face.load().then((loaded) => {
            document.fonts.add(loaded);
            applyRoomStyle(); // re-apply so text using this font picks it up
          }).catch(() => {});
          _registeredCustomFonts.add(f.name);
        } catch (err) { /* ignore malformed font */ }
      });
    }

    /* Post-layout re-centring for Style 7 (see the call site below): after the
       browser lays everything out, measure where the seat block ACTUALLY
       landed and shift the (invisible, pointer-events-none) panel so the block
       sits vertically centred in the visible viewport. Corrects from live
       geometry, so dynamic toolbars / zoom quirks / residual offsets cannot
       sink the room off-screen. */
    function scheduleStyle7CenterCheck(baseX, baseY, yvCss) {
      const panel = roomPanel;
      if (!panel || !roomGrid) return;
      const zoom = parseFloat(panel.style.zoom || "1") || 1;
      if (panel._s7raf) cancelAnimationFrame(panel._s7raf);
      panel._s7raf = requestAnimationFrame(() => {
        panel._s7raf = null;
        try {
          const hl = document.getElementById("hostLayout");
          const hlRect = hl ? hl.getBoundingClientRect() : { top: 0 };
          const visTop = Math.max(hlRect.top, 0);
          const visH = Math.min(window.innerHeight, (hl && hl.clientHeight) || window.innerHeight);
          let top = Infinity, bottom = -Infinity;
          roomGrid.querySelectorAll(".slot").forEach((s) => {
            const r = s.getBoundingClientRect();
            if (r.width > 0) {
              if (r.top < top) top = r.top;
              if (r.bottom > bottom) bottom = r.bottom;
            }
          });
          if (!isFinite(top) || !isFinite(bottom)) return;
          const blockH = bottom - top;
          /* Centre + the user's drag offset (in screen px), then clamp the
             whole block inside the visible viewport — the block is ALWAYS
             reachable, never sunk off-screen, and drags still land. */
          let desiredTop = visTop + Math.max(0, (visH - blockH) / 2) + (yvCss || 0) * zoom;
          desiredTop = Math.max(visTop + 4, Math.min(desiredTop, visTop + visH - blockH - 4));
          const dyScreen = desiredTop - top; // + block must move down, − up
          if (Math.abs(dyScreen) < 2) return;
          panel.style.transform = `translate(${baseX}px, ${baseY + dyScreen / zoom}px)`;
        } catch (e) { /* never break layout over this */ }
      });
    }

    function applyRoomStyle() {
      registerCustomFonts(roomStyle.customFonts);
      const { slotHeight, colWidth, gap, bg1, bg2, blend, plusSize, labelSize, camWidth, camHeight, camRadius, camZoom, speakingBorderRadius, camOffsetX, camOffsetY, closedCamWidth, closedCamHeight, closedCamOffsetX, closedCamOffsetY, roomWidth, roomHeight, roomRadius, roomOffsetX, roomOffsetY, roomWidth2 } = roomStyle;
      const animationWidth = seatStyleMode === 2 ? (roomStyle.animationWidth2 ?? roomStyle.animationWidth) : seatStyleMode === 3 ? (roomStyle.animationWidth3 ?? roomStyle.animationWidth) : seatStyleMode === 5 ? (roomStyle.animationWidth5 ?? roomStyle.animationWidth) : roomStyle.animationWidth;
      const animationHeight = seatStyleMode === 2 ? (roomStyle.animationHeight2 ?? roomStyle.animationHeight) : seatStyleMode === 3 ? (roomStyle.animationHeight3 ?? roomStyle.animationHeight) : seatStyleMode === 5 ? (roomStyle.animationHeight5 ?? roomStyle.animationHeight) : roomStyle.animationHeight;
      const animationOffsetX = seatStyleMode === 2 ? (roomStyle.animationOffsetX2 ?? roomStyle.animationOffsetX) : seatStyleMode === 3 ? (roomStyle.animationOffsetX3 ?? roomStyle.animationOffsetX) : seatStyleMode === 5 ? (roomStyle.animationOffsetX5 ?? roomStyle.animationOffsetX) : roomStyle.animationOffsetX;
      const animationOffsetY = seatStyleMode === 2 ? (roomStyle.animationOffsetY2 ?? roomStyle.animationOffsetY) : seatStyleMode === 3 ? (roomStyle.animationOffsetY3 ?? roomStyle.animationOffsetY) : seatStyleMode === 5 ? (roomStyle.animationOffsetY5 ?? roomStyle.animationOffsetY) : roomStyle.animationOffsetY;
      _giftAudioEl.volume = getAnimationAudioVolume();
      const bgOpacity = Math.min(1, Math.max(0, Number(roomStyle.bgOpacityPercent ?? 100) / 100));
      const withAlpha = (color) => {
        const c = String(color || '').trim();
        const hex = c.match(/^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$/);
        if (hex) {
          let raw = hex[1];
          if (raw.length === 3) raw = raw.split('').map((ch) => ch + ch).join('');
          const r = parseInt(raw.slice(0, 2), 16);
          const g = parseInt(raw.slice(2, 4), 16);
          const b = parseInt(raw.slice(4, 6), 16);
          return `rgba(${r}, ${g}, ${b}, ${bgOpacity})`;
        }
        const rgb = c.match(/^rgba?\(([^)]+)\)$/i);
        if (rgb) {
          const parts = rgb[1].split(',').map((p) => p.trim());
          if (parts.length >= 3) {
            const r = Number(parts[0]) || 0;
            const g = Number(parts[1]) || 0;
            const b = Number(parts[2]) || 0;
            return `rgba(${r}, ${g}, ${b}, ${bgOpacity})`;
          }
        }
        return c || `rgba(20, 23, 28, ${bgOpacity})`;
      };
      const requestStyle = String(roomStyle.requestTextStyle || "regular").toLowerCase();
      const requestFontMap = {
        regular: '"TikTok Sans", "Segoe UI", "Helvetica Neue", Arial, sans-serif',
        medium: '"TikTok Sans Medium", "TikTok Sans", "Segoe UI", "Helvetica Neue", Arial, sans-serif',
        semibold: '"TikTok Sans SemiBold", "TikTok Sans", "Segoe UI", "Helvetica Neue", Arial, sans-serif',
        bold: '"TikTok Sans Bold", "TikTok Sans", "Segoe UI", "Helvetica Neue", Arial, sans-serif',
        condensed: '"TikTok Sans Condensed", "TikTok Sans", "Segoe UI", "Helvetica Neue", Arial, sans-serif',
        expanded: '"TikTok Sans Expanded", "TikTok Sans", "Segoe UI", "Helvetica Neue", Arial, sans-serif',
      };
      /* A preset key (regular/bold/…) maps to a TikTok Sans weight; any other

      const requestFontFamily = requestFontMap[requestStyle]
        || (requestStyle ? `"${roomStyle.requestTextStyle}", "TikTok Sans", "Segoe UI", Arial, sans-serif` : requestFontMap.regular);

      /* Style 6 turns these off on the room panel and offsets the grid —
         restore for every style (the branches below run after this reset;
         style 6 re-applies them). */
      if (roomPanel) {
        roomPanel.style.pointerEvents = "";
        roomPanel.style.overflow = "";
      }
      roomGrid.style.marginLeft = "";
      roomGrid.style.marginTop = "";

      /* ── Seat Style 2: single-column, same slot design as style 1 ── */
      if (seatStyleMode === 2) {
        const style2ItemWidth = `calc((100% - ${gap}px) / 2)`;
        roomGrid.style.display = "flex";
        roomGrid.style.flexDirection = "column-reverse";
        roomGrid.style.alignItems = "center";
        roomGrid.style.justifyContent = "flex-start";
        roomGrid.style.flex = "1 1 auto";
        roomGrid.style.height = "";
        roomGrid.style.overflow = "visible";
        roomGrid.style.gridTemplateColumns = "";
        roomGrid.style.gap = `${gap}px`;
        buildStyle2RoomUI();
        clearStyle5RoomUI();
        const style2Header = roomPanel ? roomPanel.querySelector(".style2-request-header") : null;
        if (style2Header) {
          style2Header.style.borderRadius = `${Math.max(0, Number(roomStyle.requestBoxRadius ?? 10) || 0)}px`;
          style2Header.style.width = style2ItemWidth;
          style2Header.style.alignSelf = "center";
          style2Header.style.margin = `0 0 ${gap}px 0`;
        }
        roomGrid._s2scale = { style2ItemWidth };
      } else if (seatStyleMode === 5) {
        /* ── Seat Style 5: 2-seat vertical column ── */
        /* Seat width = camWidth, seat height = camHeight / 2 */
        clearStyle2RoomUI();
        buildStyle5RoomUI();
        roomGrid.style.display = "flex";
        roomGrid.style.flexDirection = "column";
        roomGrid.style.alignItems = "center";
        roomGrid.style.justifyContent = "flex-start";
        roomGrid.style.flex = "";
        roomGrid.style.height = "";
        roomGrid.style.overflow = "visible";
        roomGrid.style.gridTemplateColumns = "";
        roomGrid.style.gridTemplateRows = "";
        roomGrid.style.gap = `${gap}px`;
        roomGrid._s5scale = { seatWidth: camWidth, seatHeight: camWidth };
      } else if (seatStyleMode === 6 || seatStyleMode === 7) {
        /* ── Seat Style 6/7: Style 1 split open around the cam ──
           Style 7 shares this layout + drag; only the cam differs (fullscreen).
           Identical to Style 1 (same zoom, same slot sizes, same panel
           position, same Y for cam and seats) except:
           • the two seat columns move apart by a FROZEN gap (style6GapW)
           • seats 0-3 fill the left column, 4-7 the right (column flow)
           • the cam moves RIGHT into the middle gap (X only — Y untouched)
           The panel itself is non-interactive (pointer-events:none) so clicks
           over the cam/gap reach the CAM, not the invisible panel box — and
           resizing the cam can never accidentally drag the room or firework. */
        clearStyle2RoomUI();
        clearStyle5RoomUI();
        if (roomPanel) roomPanel.style.zoom = "";
        const scale6 = Math.max(0.1, (roomStyle.roomScale1 ?? 100) / 100);
        if (roomPanel) roomPanel.style.zoom = String(scale6);
        if (roomPanel) {
          roomPanel.style.pointerEvents = "none"; // only slots re-enable events
          roomPanel.style.overflow = "visible";    // X-dragged columns may overflow
        }
        roomGrid.style.display = "grid";
        roomGrid.style.flexDirection = "";
        roomGrid.style.alignItems = "";
        roomGrid.style.flex = "";
        roomGrid.style.height = "";
        roomGrid.style.overflow = "";
        /* FIXED column widths (not 1fr): with 1fr, widening the panel box for
           a dragged column stretched BOTH columns and the left one changed
           width. Fixed tracks keep every seat exactly the same size no matter
           how far the columns are dragged. A SHARED scale (style6SeatScale,
           set by edge-resizing ANY seat) sizes BOTH columns together. */
        const s6W = Number(roomWidth) || 215;
        const s6Scale = Math.min(300, Math.max(30, Number(roomStyle.style6SeatScale) || 100));
        const s6ColW = Math.max(20, Math.round(((s6W - gap) / 2) * s6Scale / 100));
        let s6SeatH = Math.max(30, Math.round((Number(slotHeight) || 101) * s6Scale / 100));
        if (seatStyleMode === 7) {
          /* Style 7: the column is over a fullscreen cam, so all 4 rows must fit
             the VISIBLE screen height (× the panel zoom), leaving ~24px margin.
             Caps the seat height so the 4th seat never sinks off the bottom, at
