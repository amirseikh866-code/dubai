                : seatStyleMode === 7
                  ? (function () {
                      /* Centre the UNDRAGGED block: the panel sits so the
                         natural 4-row height is centred, and the shared Y
                         (_s6yv, clamped symmetric ±slack) then moves the
                         seats away from that centre — which is exactly what
                         makes the Y-drag visible. (The previous version
                         subtracted _yv here, which cancelled every drag.) */
                      var _hl = document.getElementById("hostLayout");
                      var _H = Math.min((_hl && _hl.clientHeight) || window.innerHeight, window.innerHeight);
                      var _seatH = (s6box && s6box.seatH) || (Number(slotHeight) || 101);
                      var _natH = _seatH * 4 + (Number(gap) || 0) * 3;
                      return Math.max(4, (_H / roomScale - _natH) / 2);
                    })()
                  : roomOffsetY;
        /* Style 2: anchor panel from its BOTTOM edge so it grows upward.
           zoom scales transform, so rendered bottom = (translateY + offsetHeight) * scale.
           Solve for translateY so rendered bottom = activeRoomOY. */
        const translateY = seatStyleMode === 2
          ? (activeRoomOY / roomScale - (roomPanel.offsetHeight || 0))
          : activeRoomOY;
        /* Style 6: the panel box is shifted left/up when the columns were
           dragged left (shift) or all seats dragged up (shiftY) — the grid's
           margins compensate so the seats stay put; only the box follows. */
        const s6OX = s6box ? activeRoomOX + s6box.shift : activeRoomOX;
        const s6OY = s6box ? translateY + s6box.shiftY : translateY;
        roomPanel.style.transform = `translate(${s6OX + desktopExtraX}px, ${s6OY}px)`;
        /* Style 7: measure the REAL seat rects after layout and re-centre the
           block on-screen. This catches anything the math above cannot see on
           a real phone — dynamic browser toolbars, zoom/transform interplay,
           any residual offset — by correcting from live geometry instead of
           assumptions. Idempotent: always re-derived from the stored base. */
        /* Always run the measured pass for style 7 — it now targets
           centre + the effective drag Y, so it corrects any layout error
           (toolbars, zoom quirks, stale offsets) WITHOUT cancelling a drag. */
        if (seatStyleMode === 7) {
          scheduleStyle7CenterCheck(s6OX + desktopExtraX, s6OY,
            (roomGrid._s6eff ? Number(roomGrid._s6eff.Y) || 0 : 0));
        }
        /* Style 2: room panel always in front of cam */
        if (!editMoveEnabled) {
          if (seatStyleMode === 2) {
            roomPanel.style.zIndex = "3";
            if (videoWrap) videoWrap.style.zIndex = "2";
          } else if (seatStyleMode === 7) {
            /* Fullscreen cam sits BEHIND; the seat columns overlay on top. */
            roomPanel.style.zIndex = "3";
            if (videoWrap) videoWrap.style.zIndex = "1";
          } else {
            roomPanel.style.zIndex = "";
            if (videoWrap) videoWrap.style.zIndex = "";
          }
        }
      }

      // Style 3: position cam by measuring the hero slot's actual screen rect AFTER room panel layout
      if (seatStyleMode === 3 && videoWrap && roomGrid) {
        const heroSlot = roomGrid.querySelector(".slot");
        const heroRect = heroSlot ? heroSlot.getBoundingClientRect() : null;
        const layoutEl = document.getElementById("hostLayout");
        const layoutRect = layoutEl ? layoutEl.getBoundingClientRect() : { left: 0, top: 0 };
        if (heroRect && heroRect.width > 0) {
          const camW = Math.round(heroRect.width);
          const camH = Math.round(heroRect.height);
          // Cam right edge = hero slot left edge minus gap; cam top = hero slot top
          const zoomFactor = roomPanel ? parseFloat(roomPanel.style.zoom || "1") : 1;
          const renderedGap = gap * zoomFactor;
          const camLeft = heroRect.left - camW - renderedGap - layoutRect.left;
          const camTop = heroRect.top - layoutRect.top;
          // style3CamOffsetX/Y: manual fine-tune delta (0 = perfect alignment)
          const deltaX = Number(roomStyle.style3CamOffsetX) || 0;
          const deltaY = Number(roomStyle.style3CamOffsetY) || 0;
          const finalX = camLeft + deltaX;
          const finalY = camTop + deltaY;
          _autoStyle3CamX = camLeft;
          videoWrap.style.width = `${camW}px`;
          videoWrap.style.height = `${camH}px`;
          videoWrap.style.borderRadius = `${Math.max(0, Number(camRadius) || 0)}px`;
          videoWrap.style.setProperty("--speaking-border-radius", `${Math.max(0, Number(speakingBorderRadius) || 0)}px`);
          videoWrap.style.transform = `translate(${finalX}px, ${finalY}px)`;
          const zoomScale3 = Math.max(0.5, (camZoom ?? 100) / 100);
          if (videoEl) videoEl.style.transform = `scale(${zoomScale3})`;
          resizeAiCanvas();
          resizeSegCanvas();
          resizeChromaCanvas();
          if (window.VRMController && typeof window.VRMController.resize === "function") {
            window.VRMController.resize();
          }
        }
      }

      // Style 4: position cam inside first seat slot (slot 0), hide slot 0
      if (seatStyleMode === 4 && videoWrap && roomGrid) {
        const firstSlot = roomGrid.querySelector(".slot");
        if (firstSlot) firstSlot.style.visibility = "hidden";
        const slotRect = firstSlot ? firstSlot.getBoundingClientRect() : null;
        const layoutEl = document.getElementById("hostLayout");
        const layoutRect = layoutEl ? layoutEl.getBoundingClientRect() : { left: 0, top: 0 };
        if (slotRect && slotRect.width > 0) {
          const camW = Math.round(slotRect.width);
          const camH = Math.round(slotRect.height);
          const camLeft = slotRect.left - layoutRect.left;
          const camTop = slotRect.top - layoutRect.top;
          videoWrap.style.width = `${camW}px`;
          videoWrap.style.height = `${camH}px`;
          videoWrap.style.borderRadius = `${Math.max(0, Number(roomRadius) || 0)}px`;
          videoWrap.style.setProperty("--speaking-border-radius", "0px");
          videoWrap.style.transform = `translate(${camLeft}px, ${camTop}px)`;
          const zoomScale4 = Math.max(0.5, (camZoom ?? 100) / 100);
          if (videoEl) videoEl.style.transform = `scale(${zoomScale4})`;
          resizeAiCanvas();
          resizeSegCanvas();
          resizeChromaCanvas();
          if (window.VRMController && typeof window.VRMController.resize === "function") {
            window.VRMController.resize();
          }
        }
      } else if (seatStyleMode !== 4 && seatStyleMode !== 5 && roomGrid) {
        // Restore slot 0 visibility when not in style 4 or 5
        const firstSlot = roomGrid.querySelector(".slot");
        if (firstSlot) firstSlot.style.visibility = "";
      }

      // Style 5: use cam width/height same as Style 1, position to left of seats
      if (seatStyleMode === 5 && videoWrap && roomGrid) {
        const firstSlot = roomGrid.querySelector(".slot");
        const slotRect = firstSlot ? firstSlot.getBoundingClientRect() : null;
        const layoutEl = document.getElementById("hostLayout");
        const layoutRect = layoutEl ? layoutEl.getBoundingClientRect() : { left: 0, top: 0 };
        // Use Style 1 cam dimensions
        const camW = camWidth;
        const camH = camHeight;
        if (slotRect) {
          const zoomFactor = roomPanel ? parseFloat(roomPanel.style.zoom || "1") : 1;
          const renderedGap = gap * zoomFactor;
          const camLeft = slotRect.left - camW - renderedGap - layoutRect.left;
          const camTop = slotRect.top - layoutRect.top;
          // style5CamOffsetX/Y: manual fine-tune delta (0 = perfect alignment)
          const deltaX = Number(roomStyle.style5CamOffsetX) || 0;
          const deltaY = Number(roomStyle.style5CamOffsetY) || 0;
          const finalX = camLeft + deltaX;
          const finalY = camTop + deltaY;
          videoWrap.style.width = `${camW}px`;
          videoWrap.style.height = `${camH}px`;
          videoWrap.style.borderRadius = `${Math.max(0, Number(camRadius) || 0)}px`;
          videoWrap.style.setProperty("--speaking-border-radius", `${Math.max(0, Number(speakingBorderRadius) || 0)}px`);
          videoWrap.style.transform = `translate(${finalX}px, ${finalY}px)`;
          const zoomScale5 = Math.max(0.5, (camZoom ?? 100) / 100);
          if (videoEl) videoEl.style.transform = `scale(${zoomScale5})`;
          resizeAiCanvas();
          resizeSegCanvas();
          resizeChromaCanvas();
          if (window.VRMController && typeof window.VRMController.resize === "function") {
            window.VRMController.resize();
          }
        }
      }

      if (animationBox) {
        /* Style 7 uses the SAME animation box as Style 6 — shared keys and the
           generic translate below. One catch: Style 7's cam (videoWrap) fills
           the whole viewport, and because .animation-box is position:absolute
           with top:auto, its flow baseline would otherwise land BELOW that
           fullscreen cam (shoved to the very bottom of the page). Every other
           style's box baselines at the normal cam height, so anchor Style 7 at
           that SAME height (camHeight — the un-fullscreened value) and the two
           styles line up. */
        animationBox.style.top = seatStyleMode === 7 ? `${camHeight}px` : "";
        animationBox.style.right = "";
        animationBox.style.bottom = "";
        animationBox.style.left = seatStyleMode === 7 ? "0" : "";
        animationBox.style.width = `${animationWidth}px`;
        animationBox.style.height = `${animationHeight}px`;
        animationBox.style.transform = `translate(${animationOffsetX + desktopExtraX}px, ${animationOffsetY}px)`;
        if (!editMoveEnabled) {
          animationBox.style.zIndex = "30";
        }
      }

      if (giftOverlay) {
        const fadeTopRaw = Number(roomStyle.animationFadeTopPercent);
        const fadeTopPct = Number.isFinite(fadeTopRaw) ? Math.max(0, Math.min(100, fadeTopRaw)) : 0;
        giftOverlay.style.setProperty("--anim-fade-top", `${fadeTopPct}%`);
        const tintColor = typeof roomStyle.animationColor === "string" && /^#[0-9a-fA-F]{6}$/.test(roomStyle.animationColor)
          ? roomStyle.animationColor : "#000000";
        const strengthRaw = Number(roomStyle.animationColorStrength);
        const strengthPct = Number.isFinite(strengthRaw) ? Math.max(0, Math.min(100, strengthRaw)) : 0;
        giftOverlay.style.setProperty("--anim-tint-color", tintColor);
        giftOverlay.style.setProperty("--anim-tint-alpha", String(strengthPct / 100));
        // Colour backdrop BEHIND the animation (shadow).
        const shadowColor = typeof roomStyle.animationShadowColor === "string" && /^#[0-9a-fA-F]{6}$/.test(roomStyle.animationShadowColor)
          ? roomStyle.animationShadowColor : "#000000";
        const shadowFadeRaw = Number(roomStyle.animationShadowFadeTop);
        const shadowFadePct = Number.isFinite(shadowFadeRaw) ? Math.max(0, Math.min(100, shadowFadeRaw)) : 0;
        giftOverlay.style.setProperty("--anim-shadow-color", shadowColor);
        giftOverlay.style.setProperty("--anim-shadow-fade-top", `${shadowFadePct}%`);
        const giftShadowEl = document.getElementById("giftShadow");
        if (giftShadowEl) giftShadowEl.classList.toggle("on", !!roomStyle.animationShadowEnabled);
      }

      if (fireworkBox) {
        const fireworkWidth = Number(roomStyle.fireworkWidth ?? 260) || 260;
        const fireworkHeight = Number(roomStyle.fireworkHeight ?? 260) || 260;
        const fireworkOffsetX = Number(seatStyleMode === 2 ? (roomStyle.fireworkOffsetX2 ?? roomStyle.fireworkOffsetX) : seatStyleMode === 3 ? (roomStyle.fireworkOffsetX3 ?? roomStyle.fireworkOffsetX) : seatStyleMode === 5 ? (roomStyle.fireworkOffsetX5 ?? roomStyle.fireworkOffsetX) : (roomStyle.fireworkOffsetX ?? 89));
        const fireworkOffsetY = Number(seatStyleMode === 2 ? (roomStyle.fireworkOffsetY2 ?? roomStyle.fireworkOffsetY) : seatStyleMode === 3 ? (roomStyle.fireworkOffsetY3 ?? roomStyle.fireworkOffsetY) : seatStyleMode === 5 ? (roomStyle.fireworkOffsetY5 ?? roomStyle.fireworkOffsetY) : (roomStyle.fireworkOffsetY ?? -422));
        fireworkBox.style.width = `${fireworkWidth}px`;
        fireworkBox.style.height = `${fireworkHeight}px`;
        fireworkBox.style.transform = `translate(${fireworkOffsetX + desktopExtraX}px, ${fireworkOffsetY}px)`;
        if (!editMoveEnabled) {
          fireworkBox.style.zIndex = "35";
        }
      }

      if (giftSenderCapsule) {
        const capX = Number(roomStyle.giftCapsuleOffsetX ?? 10);
        const capY = Number(roomStyle.giftCapsuleOffsetY ?? 400);
        const capScale = Number(roomStyle.giftCapsuleScale ?? 100) / 100;
        giftSenderCapsule.style.left = `${capX + desktopExtraX}px`;
        giftSenderCapsule.style.top = `${capY}px`;
        giftSenderCapsule.style.transform = `scale(${capScale})`;
        giftSenderCapsule.style.transformOrigin = "left center";
      }

      if (giftReceivedCard) {
        const grX = Number(roomStyle.giftReceivedOffsetX ?? 70);
        const grY = Number(roomStyle.giftReceivedOffsetY ?? 420);
        const grScale = Number(roomStyle.giftReceivedScale ?? 100) / 100;
        giftReceivedCard.style.left = `${grX + desktopExtraX}px`;
        giftReceivedCard.style.top = `${grY}px`;
        giftReceivedCard.style.transform = `scale(${grScale})`;
        giftReceivedCard.style.transformOrigin = "left center";
      }

      if (customRewardBox) {
        const crX = Number(roomStyle.customRewardOffsetX ?? 70);
        const crY = Number(roomStyle.customRewardOffsetY ?? 100);
        const crScale = Number(roomStyle.customRewardScale ?? 100) / 100;
        customRewardBox.style.left = `${crX + desktopExtraX}px`;
        customRewardBox.style.top = `${crY}px`;
        customRewardBox.style.transform = `scale(${crScale})`;
        customRewardBox.style.transformOrigin = "left center";
      }

      positionGiftOverlay();
      applyRequestTextVisibility();
      scheduleAnimBoxVisibilityCheck();
      try {
        localStorage.setItem(styleStoreKey, JSON.stringify({ ...roomStyle, _v: styleStoreVersion }));
      } catch (err) { /* ignore */ }
      debounceSaveLayout();
    }

    /* ── Animation-box visibility guarantee ──────────────────────────────────
       Measured, style-agnostic safety net (same philosophy as the style-7
       seat fix): after the browser lays the page out, MEASURE where the
       animation box actually landed. If less than 40px is visible in the
       viewport, pull it back inside via the CSS `translate` property (which
       composes with — never fights — whatever transform/anchor positioning
       the active style uses), and persist the correction into the active
       offset keys so Edit Mode drags start from the VISIBLE position. This
       ends the off-page box class of bugs regardless of which stale value,
       migration, or zoom quirk produced it. */
    function scheduleAnimBoxVisibilityCheck() {
      const box = animationBox;
      if (!box) return;
      if (box._abraf) cancelAnimationFrame(box._abraf);
      box._abraf = requestAnimationFrame(() => {
        box._abraf = null;
        try {
          const hl = document.getElementById("hostLayout");
          const hlRect = hl ? hl.getBoundingClientRect() : { top: 0, left: 0 };
          const visTop = Math.max(hlRect.top, 0);
          const visH = window.innerHeight;
          const visW = Math.min((hl && hl.clientWidth) || window.innerWidth, window.innerWidth);
          const r = box.getBoundingClientRect();
          if (!r.width || !r.height) return;
          const visY = Math.min(r.bottom, visTop + visH) - Math.max(r.top, visTop);
          const visX = Math.min(r.right, hlRect.left + visW) - Math.max(r.left, hlRect.left);
          if (visY >= 40 && visX >= 40) { box.style.translate = ""; return; }
          let dy = 0, dx = 0;
          if (r.top > visTop + visH - 40) dy = visTop + visH - 40 - r.top;   // too low
          else if (r.bottom < visTop + 40) dy = visTop + 40 - r.bottom;      // too high
          if (r.left > hlRect.left + visW - 40) dx = hlRect.left + visW - 40 - r.left; // too right
          else if (r.right < hlRect.left + 40) dx = hlRect.left + 40 - r.right;        // too left
          if (!dx && !dy) { box.style.translate = ""; return; }
          box.style.translate = `${dx}px ${dy}px`;
          /* Persist into the active offset keys so Edit-Mode drags begin from
             the now-visible position instead of snapping back. */
          if (seatStyleMode === 1 || seatStyleMode === 4 || seatStyleMode === 6 || seatStyleMode === 7) {
            roomStyle.animationOffsetX = (Number(roomStyle.animationOffsetX) || 0) + dx;
            roomStyle.animationOffsetY = (Number(roomStyle.animationOffsetY) || 0) + dy;
          } else if (seatStyleMode === 2) {
            roomStyle.animationOffsetX2 = (Number(roomStyle.animationOffsetX2 ?? roomStyle.animationOffsetX) || 0) + dx;
            roomStyle.animationOffsetY2 = (Number(roomStyle.animationOffsetY2 ?? roomStyle.animationOffsetY) || 0) + dy;
          } else if (seatStyleMode === 3) {
            roomStyle.animationOffsetX3 = (Number(roomStyle.animationOffsetX3 ?? roomStyle.animationOffsetX) || 0) + dx;
            roomStyle.animationOffsetY3 = (Number(roomStyle.animationOffsetY3 ?? roomStyle.animationOffsetY) || 0) + dy;
          } else if (seatStyleMode === 5) {
            roomStyle.animationOffsetX5 = (Number(roomStyle.animationOffsetX5 ?? roomStyle.animationOffsetX) || 0) + dx;
            roomStyle.animationOffsetY5 = (Number(roomStyle.animationOffsetY5 ?? roomStyle.animationOffsetY) || 0) + dy;
          }
        } catch (e) { /* never break layout over this */ }
      });
    }

    function broadcastCurrentStyle(origin = "host") {
      const payload = { type: "remote-style", style: { ...roomStyle, _v: styleStoreVersion }, source: origin, ts: Date.now() };
      if (channel) {
        channel.postMessage(payload);
      } else {
        localStorage.setItem(fallbackKey, JSON.stringify(payload));
      }
    }

    function updateRoomUI(open) {
      roomOpen = open;
      roomPanel.classList.toggle("show", open);
      resetSeatGiftIcons();
      applyRoomStyle();
      positionGiftOverlay();
    }

    function canRequestUserMedia() {
      return !!(window.isSecureContext && navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
    }

    function stopMicMonitor() {
      if (micRaf) {
        cancelAnimationFrame(micRaf);
        micRaf = null;
      }
      if (micSource) {
        try { micSource.disconnect(); } catch (err) { /* ignore */ }
        micSource = null;
      }
      micAnalyser = null;
      micData = null;
      micActive = false;
    }

    /* ── Auto blink border ──────────────────────────────────────────────
       Some clients' mics can't be detected (no audio track / blocked
       permission), so the blue speaking border never lights up. When mode2
       turns this on, pulse the border on a timer instead. Default OFF. */
    let autoBlinkBorderEnabled = false;
    let autoBlinkTimer = null;
    const AUTO_BLINK_ON_MS = 900;   // border visible
    const AUTO_BLINK_OFF_MS = 600;  // border hidden

    function autoBlinkActive() {
      // Mirrors the mic monitor's conditions so the two behave identically.
      return autoBlinkBorderEnabled && speakingBorderVisible && seatStyleMode !== 4;
    }

    function stopAutoBlinkBorder() {
      if (autoBlinkTimer) { clearTimeout(autoBlinkTimer); autoBlinkTimer = null; }
      if (videoWrap) videoWrap.classList.remove("cam-speaking");
    }

    function applyAutoBlinkBorder() {
      stopAutoBlinkBorder();
      if (!autoBlinkActive()) return;
      const step = (on) => {
        if (!autoBlinkActive()) { stopAutoBlinkBorder(); return; }
        if (videoWrap) videoWrap.classList.toggle("cam-speaking", on);
        autoBlinkTimer = setTimeout(() => step(!on), on ? AUTO_BLINK_ON_MS : AUTO_BLINK_OFF_MS);
      };
      step(true);
    }

    function setupMicMonitorFromStream(nextStream) {
      if (!nextStream) return;
      const audioTracks = typeof nextStream.getAudioTracks === "function" ? nextStream.getAudioTracks() : [];
      if (!audioTracks.length) return;
      stopMicMonitor();
      micStream = nextStream;
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return;
      if (!micCtx || micCtx.state === "closed") {
        micCtx = new AudioCtx();
      }
      if (micCtx.state === "suspended") {
        micCtx.resume().catch(() => {});
      }
      micSource = micCtx.createMediaStreamSource(nextStream);
      micAnalyser = micCtx.createAnalyser();
      micAnalyser.fftSize = 512;
      micData = new Uint8Array(micAnalyser.fftSize);
      micSource.connect(micAnalyser);
      micActive = true;
      const tick = () => {
        if (!micAnalyser || !micData) return;
        micAnalyser.getByteTimeDomainData(micData);
        let sum = 0;
        for (let i = 0; i < micData.length; i++) {
          const v = (micData[i] - 128) / 128;
          sum += v * v;
        }
        const rms = Math.sqrt(sum / micData.length);
        const speaking = rms > 0.04;
        // When auto-blink drives the border, don't let the mic tick fight it.
        if (videoWrap && !autoBlinkActive()) {
          videoWrap.classList.toggle("cam-speaking", speaking && speakingBorderVisible && seatStyleMode !== 4);
        }
        micRaf = requestAnimationFrame(tick);
      };
      tick();
    }

    async function startCamera() {
      if (!canRequestUserMedia()) {
        console.warn("Camera/mic requires a secure context. Open this page from localhost/HTTPS instead of 0.0.0.0.");
        setCamStatus("Camera unavailable — open the app over HTTPS or localhost (not an IP address).");
        return;
      }
      try {
        if (stream) {
          stream.getTracks().forEach((track) => track.stop());
          stream = null;
        }
      } catch (err) { /* ignore */ }
      const videoConstraint = { facingMode: { ideal: currentFacingMode } };
      try {
        // Request audio only if the mic is on; if the combined request fails
        // (e.g. no/blocked microphone) fall back to video-only so the camera
        // still shows instead of a black screen.
        try {
          stream = await navigator.mediaDevices.getUserMedia({ video: videoConstraint, audio: micEnabled });
        } catch (errCombined) {
          if (micEnabled) {
            stream = await navigator.mediaDevices.getUserMedia({ video: videoConstraint, audio: false });
          } else {
            throw errCombined;
          }
        }
        micStream = stream;
        if (micEnabled && stream.getAudioTracks().length) setupMicMonitorFromStream(stream);
        videoEl.srcObject = stream;
        const playPromise = videoEl.play();
        if (playPromise && typeof playPromise.catch === "function") {
          playPromise.catch(() => {});
        }
        setCamStatus("");
      } catch (err) {
        const name = err && err.name ? err.name : String(err);
        console.warn("Camera/mic access failed:", name);
        const denied = /NotAllowed|SecurityError|Permission/i.test(name);
        setCamStatus(denied
          ? "Camera blocked — allow camera access for this app in your system settings."
          : "Camera unavailable — no camera was found or it's in use by another app.");
      }
    }

    function isStreamActive() {
      if (!stream || typeof stream.getTracks !== "function") return false;
      return stream.getTracks().some((track) => track.readyState === "live");
    }

    function startMicMonitor() {
      if (micActive) return;
      if (stream && typeof stream.getAudioTracks === "function" && stream.getAudioTracks().some((track) => track.readyState === "live")) {
        setupMicMonitorFromStream(stream);
        return;
      }
      if (!canRequestUserMedia()) return;
      navigator.mediaDevices.getUserMedia({ audio: true }).then((stream) => {
        setupMicMonitorFromStream(stream);
      }).catch(() => {
        micActive = false;
      });
    }

    function ensureMicStart() {
      if (micEnabled && !micActive) startMicMonitor();
      if (!isStreamActive()) startCamera();
      if (micEnabled && micCtx && micCtx.state === "suspended") {
        micCtx.resume().catch(() => {});
      }
    }
    ["pointerdown", "touchstart", "click"].forEach((evt) => {
      document.addEventListener(evt, ensureMicStart, { passive: true });
    });

    function toggleCameraFacing() {
      currentFacingMode = currentFacingMode === "environment" ? "user" : "environment";
      try { localStorage.setItem(camFacingStoreKey, currentFacingMode); } catch (err) { /* ignore */ }
      startCamera();
    }

    /* Sentinel persisted when the host explicitly removes the cam background.
       It means "show the live camera, NOT the default cam-bg video" and lets the
       load path tell an intentional removal apart from a never-configured cam
       (empty string), which still falls back to the default video. */
    const CAM_BG_NONE = "__none__";

    /* Re-point the <video> at the live stream if it got detached (e.g. a bg was
       shown earlier, which nulls srcObject). Fixes the black screen after the
       background is removed while a stream is still live. */
    function ensureVideoStreamAttached() {
      if (videoEl && stream && videoEl.srcObject !== stream) {
        videoEl.srcObject = stream;
        const p = videoEl.play();
        if (p && typeof p.catch === "function") p.catch(() => {});
      }
    }

    function setCamBackground(dataUrl, opts = {}) {
      if (!camBgEl && !camBgVideoEl) return;

      const isNone = dataUrl === CAM_BG_NONE;
      const visualUrl = isNone ? "" : (dataUrl || "");

      // Detect if this is a video. blob: object URLs carry no mime/extension
      // hint, so the picker/restore pass opts.isVideo explicitly.
      const isVideo = visualUrl && (
        opts.isVideo === true ||
        visualUrl.startsWith("data:video/") ||
        !!visualUrl.match(/\.(mp4|webm|mov|avi|mkv)$/i)
      );

      if (visualUrl) {
        if (isVideo) {
          // Hide image, show video
          if (camBgEl) {
            camBgEl.src = "";
            camBgEl.style.display = "none";
          }
          if (camBgVideoEl) {
            camBgVideoEl.src = visualUrl;
            camBgVideoEl.style.display = "block";
            camBgVideoEl.play().catch(() => {});
          }
        } else {
          // Hide video, show image
          if (camBgVideoEl) {
            camBgVideoEl.pause();
            camBgVideoEl.src = "";
            camBgVideoEl.style.display = "none";
          }
          if (camBgEl) {
            camBgEl.src = visualUrl;
            camBgEl.style.display = "block";
          }
        }
        // Stop camera stream only if VRM is NOT enabled
        if (!camVrmEnabled && stream) {
          try { stream.getTracks().forEach((track) => track.stop()); } catch (err) { /* ignore */ }
          stream = null;
          if (videoEl) videoEl.srcObject = null;
        } else if (camVrmEnabled && !isStreamActive()) {
          startCamera();
        }
      } else {
        // No background → show the live camera.
        if (camBgEl) {
          camBgEl.src = "";
          camBgEl.style.display = "none";
        }
        if (camBgVideoEl) {
          camBgVideoEl.pause();
          camBgVideoEl.src = "";
          camBgVideoEl.style.display = "none";
        }
        if (!isStreamActive()) startCamera();
        else ensureVideoStreamAttached();
      }
      applyCamVisibility();

      // Display-only calls (restoring from disk/server) skip persistence.
      if (opts.persist === false) return;

      /* Persist a tiny MARKER on this device only. The actual video Blob is
         kept in IndexedDB by the picker — we no longer ship it to the server
         or Cloudinary. Legacy remote/data URLs (e.g. an old Cloudinary URL)
         are still remembered as-is so existing users don't lose their bg. */
      let marker;
      if (isNone) marker = CAM_BG_NONE;
      else if (opts.localBlob) marker = CAM_BG_IDB;
      else if (visualUrl && !visualUrl.startsWith("blob:")) marker = visualUrl;
      else marker = "";
      try { localStorage.setItem(camBgStoreKey, marker); } catch (err) { /* ignore */ }
      /* Auto-save the rest of the layout (small JSON, no video) so users who
         forget Save Layout in mode2 still keep their other tweaks. */
      debounceSaveLayout();
    }

    /* Restore the cam background from this device (IndexedDB) on load. Returns
       true if it applied something, false if there's nothing saved locally. */
    async function restoreCamBgFromLocal() {
      let marker = "";
      try { marker = localStorage.getItem(camBgStoreKey) || ""; } catch (err) { /* ignore */ }
      if (marker === CAM_BG_NONE) { setCamBackground(CAM_BG_NONE, { persist: false }); return true; }
      if (marker === CAM_BG_IDB) {
        try {
          const blob = await mediaStore.get(CAM_BG_DB_KEY);
          if (blob) {
            if (camBgObjectUrl) { try { URL.revokeObjectURL(camBgObjectUrl); } catch (e) {} }
            camBgObjectUrl = URL.createObjectURL(blob);
            setCamBackground(camBgObjectUrl, { persist: false, isVideo: String(blob.type || "").startsWith("video/") });
            return true;
          }
        } catch (err) { /* ignore */ }
      }
      if (marker && marker !== CAM_BG_IDB) { // legacy small remote/data URL
        setCamBackground(marker, { persist: false });
        return true;
      }
      return false;
    }

    /* Default cam background video. Applied only when no saved bg (server or
       localStorage) exists. Sets the element src directly so user "Remove"
       still works and persists the empty state. */
    const DEFAULT_CAM_BG_VIDEO = "image/cam-bg-screenrec.html";
    function applyDefaultCamBgVideo() {
      if (!camBgVideoEl) return;
      // Don't override an existing image or video background
      if (camBgEl && camBgEl.src && camBgEl.style.display !== "none") return;
      if (camBgVideoEl.src && camBgVideoEl.style.display !== "none") return;
      camBgVideoEl.src = resolveAssetUrl(DEFAULT_CAM_BG_VIDEO);
      camBgVideoEl.style.display = "block";
      camBgVideoEl.play().catch(() => {});
      if (camBgEl) { camBgEl.src = ""; camBgEl.style.display = "none"; }
      // Stop camera stream if VRM is also off (mirrors setCamBackground behaviour)
      if (!camVrmEnabled && stream) {
        try { stream.getTracks().forEach((track) => track.stop()); } catch (err) { /* ignore */ }
        stream = null;
        if (videoEl) videoEl.srcObject = null;
      }
      applyCamVisibility();
    }

    function setWebBackground(src, persist = true, opts = {}) {
      const hasBg = typeof src === "string" && src.trim().length > 0;
      if (hasBg) {
        const safe = src.replace(/"/g, '\\"');
        document.body.style.backgroundImage = `url("${safe}")`;
      } else {
        document.body.style.backgroundImage = "none";
      }
      if (persist) {
        /* Store a MARKER, never the image itself. A base64 copy in
           localStorage blew the ~5MB quota, and the same copy went to the
           server inside a 10MB JSON body — between them that was the real
           size limit on a web background. The file now lives in IndexedDB. */
        const stored = opts.localBlob ? WEB_BG_IDB : (hasBg ? src : "");
        try { localStorage.setItem(webBgStoreKey, stored); } catch (err) { /* ignore */ }
        /* Clear any legacy server copy rather than writing a new one: it must
           not come back at the next login and override this device. */
        saveWebBgToServer("");
      }
    }

    /* Mirrors restoreCamBgFromLocal. Returns true when this device supplied
       the background, so the caller knows not to let a legacy server copy
       override it. */
    async function restoreWebBgFromLocal() {
      let marker = null;
      try { marker = localStorage.getItem(webBgStoreKey); } catch (err) { marker = null; }
      if (marker === null) {            // never chosen here → ship the default
        setWebBackground(defaultWebBgUrl, false);
        return false;
      }
      if (marker === WEB_BG_IDB) {
        try {
          const blob = await mediaStore.get(WEB_BG_DB_KEY);
          if (blob) {
            if (webBgObjectUrl) { try { URL.revokeObjectURL(webBgObjectUrl); } catch (e) { /* ignore */ } }
            webBgObjectUrl = URL.createObjectURL(blob);
            setWebBackground(webBgObjectUrl, false);
            return true;
          }
        } catch (err) { /* fall through to the default below */ }
        setWebBackground(defaultWebBgUrl, false);
        return false;
      }
      /* Legacy value saved before backgrounds went local: a data: URL, a
         remote URL, or "" meaning the host removed it. All are an explicit
         choice made on this device, so they win over the server copy. */
      setWebBackground(marker, false);
      return true;
    }

    function setAiAvatar(url) {
      camAiAvatarUrl = url || "";
      camAiAvatarReady = false;
      camAiAvatarImage.onload = () => { camAiAvatarReady = true; };
      camAiAvatarImage.onerror = () => { camAiAvatarReady = false; };
      if (camAiAvatarUrl) {
        camAiAvatarImage.src = camAiAvatarUrl;
      } else {
        camAiAvatarImage.src = "";
      }
    }

    function resizeAiCanvas() {
      if (!camAiCanvas || !videoWrap) return;
      camAiCanvas.width = videoWrap.clientWidth;
      camAiCanvas.height = videoWrap.clientHeight;
    }

    function resizeSegCanvas() {
      if (!camSegCanvas || !videoWrap) return;
      camSegCanvas.width = videoWrap.clientWidth;
      camSegCanvas.height = videoWrap.clientHeight;
    }

    function drawAiAvatar(results) {
      if (!camAiCanvas || !camAiCtx) return;
      camAiCtx.clearRect(0, 0, camAiCanvas.width, camAiCanvas.height);
      if (!camAiEnabled || !camAiAvatarReady) return;
      const faces = results && results.multiFaceLandmarks;
      if (!faces || !faces.length) return;
      const landmarks = faces[0];
      let minX = 1, minY = 1, maxX = 0, maxY = 0;
      for (const p of landmarks) {
        if (p.x < minX) minX = p.x;
        if (p.y < minY) minY = p.y;
        if (p.x > maxX) maxX = p.x;
        if (p.y > maxY) maxY = p.y;
      }
      const w = camAiCanvas.width;
      const h = camAiCanvas.height;
      const faceW = (maxX - minX) * w;
      const faceH = (maxY - minY) * h;
      const centerX = (minX + maxX) * 0.5 * w;
      const centerY = (minY + maxY) * 0.5 * h;
      const scale = 1.4;
      const drawW = faceW * scale;
      const drawH = faceH * scale;
      const x = centerX - drawW / 2;
      const y = centerY - drawH / 2;
      camAiCtx.drawImage(camAiAvatarImage, x, y, drawW, drawH);
    }

    function initFaceMesh() {
      if (faceMesh || typeof FaceMesh === "undefined") return;
      faceMesh = new FaceMesh({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4/${file}`,
      });
      faceMesh.setOptions({
        maxNumFaces: 1,
        refineLandmarks: true,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5,
      });
      faceMesh.onResults(drawAiAvatar);
    }

    function initSelfieSegmentation() {
      if (selfieSegmentation || typeof SelfieSegmentation === "undefined") return;
      selfieSegmentation = new SelfieSegmentation({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation@0.1/${file}`,
      });
      selfieSegmentation.setOptions({ modelSelection: 1 });
      selfieSegmentation.onResults((results) => {
        if (!camSegCtx || !camSegCanvas) return;
        camSegCtx.clearRect(0, 0, camSegCanvas.width, camSegCanvas.height);
        if (!camSegEnabled) return;
        if (!results || !results.segmentationMask) return;

        const w = camSegCanvas.width;
        const h = camSegCanvas.height;

        camSegCtx.save();
        camSegCtx.drawImage(results.segmentationMask, 0, 0, w, h);
        camSegCtx.globalCompositeOperation = "source-in";
        camSegCtx.drawImage(results.image, 0, 0, w, h);
        camSegCtx.restore();

        // Draw background image or video behind segmented person
        const hasBgImg = camBgEl && camBgEl.style.display !== "none" && camBgEl.src;
        const hasBgVideo = camBgVideoEl && camBgVideoEl.style.display !== "none" && camBgVideoEl.src;
        if (hasBgImg || hasBgVideo) {
          camSegCtx.globalCompositeOperation = "destination-over";
          if (hasBgVideo) {
            camSegCtx.drawImage(camBgVideoEl, 0, 0, w, h);
          } else {
            camSegCtx.drawImage(camBgEl, 0, 0, w, h);
          }
          camSegCtx.globalCompositeOperation = "source-over";
        }
      });
    }

    async function aiFaceLoop() {
      if (!camAiEnabled || !faceMesh || !videoEl) return;
      if (videoEl.readyState >= 2) {
        try {
          await faceMesh.send({ image: videoEl });
        } catch (err) {
          // Ignore transient face mesh errors
        }
      }
      camAiLoopId = requestAnimationFrame(aiFaceLoop);
    }

    async function segLoop() {
      if (!camSegEnabled || !selfieSegmentation || !videoEl) return;
      if (videoEl.readyState >= 2) {
        try {
          await selfieSegmentation.send({ image: videoEl });
        } catch (err) {
          // Ignore transient segmentation errors
        }
      }
      camSegLoopId = requestAnimationFrame(segLoop);
    }

    function setAiFaceEnabled(next) {
      camAiEnabled = !!next;
      if (camAiEnabled && typeof FaceMesh === "undefined") {
        camAiEnabled = false;
        if (camAiFaceBtn) camAiFaceBtn.classList.remove("active");

      if (camAiCanvas) camAiCanvas.style.display = camAiEnabled ? "block" : "none";

      if (camAiEnabled) {
        initFaceMesh();
        resizeAiCanvas();
        if (!camAiLoopId) aiFaceLoop();
      } else if (camAiLoopId) {

    }

    function setSegEnabled(next) {
      camSegEnabled = !!next;
      if (camSegEnabled && typeof SelfieSegmentation === "undefined") {
        camSegEnabled = false;
        if (camSegBtn) camSegBtn.classList.remove("active");
        console.warn("SelfieSegmentation not available; check CDN access.");
        return;
      }
      if (camSegCanvas) camSegCanvas.style.display = camSegEnabled ? "block" : "none";
      if (camSegCtx && !camSegEnabled) camSegCtx.clearRect(0, 0, camSegCanvas.width, camSegCanvas.height);
      if (camSegEnabled) {
        initSelfieSegmentation();
        resizeSegCanvas();
        if (!camSegLoopId) segLoop();
      } else if (camSegLoopId) {
        cancelAnimationFrame(camSegLoopId);
        camSegLoopId = null;
      }
      applyCamVisibility();
    }

    function resizeChromaCanvas() {
      if (!camChromaCanvas || !videoWrap) return;
      camChromaCanvas.width = videoWrap.clientWidth;
      camChromaCanvas.height = videoWrap.clientHeight;
    }

    function chromaKeyLoop() {
      if (!camChromaEnabled || !camChromaCtx || !videoEl) return;
      if (videoEl.readyState < 2) {
        camChromaLoopId = requestAnimationFrame(chromaKeyLoop);
        return;
      }

      const w = camChromaCanvas.width;
      const h = camChromaCanvas.height;

      // Draw camera frame
      camChromaCtx.drawImage(videoEl, 0, 0, w, h);

      // Get image data for chroma keying
      const imageData = camChromaCtx.getImageData(0, 0, w, h);
      const data = imageData.data;

      for (let i = 0; i < data.length; i += 4) {
        const r = data[i];
        const g = data[i + 1];
        const b = data[i + 2];

        // Convert RGB to HSV (corrected formula)
        const max = Math.max(r, g, b);
        const min = Math.min(r, g, b);
        const delta = max - min;

        let h = 0;
        if (delta > 0) {
          if (max === r) {
            h = 60 * (((g - b) / delta) % 6);
          } else if (max === g) {
            h = 60 * ((b - r) / delta + 2);
          } else {
            h = 60 * ((r - g) / delta + 4);
          }
          if (h < 0) h += 360;
        }

        const s = max === 0 ? 0 : delta / max; // saturation 0..1
        const v = max / 255;                    // brightness 0..1

        // Skin tone guard: warm hues (red/orange/yellow) — never remove
        const isSkinTone = (h <= 55 || h >= 300) && s > 0.05 && v > 0.1;
        if (isSkinTone) continue;

        // Green detection criteria:
        // 1. Hue in green range (60°–170° covers yellow-green to cyan-green)
        // 2. Green channel is at least close to being dominant
        // 3. Some minimal saturation and brightness
        const greenDominance = g - Math.max(r, b);
        const isGreenHue = h >= 60 && h <= 170;
        const isGreen = isGreenHue && greenDominance > -20 && s > 0.05 && v > 0.08;

        if (isGreen) {
          // More dominant green = more transparent
          // Light green (low sat) still gets removed but with slight fade
          const satFade = Math.min(1, s / 0.3);
          const domFade = Math.min(1, Math.max(0, greenDominance + 20) / 60);
          const fade = Math.max(satFade, domFade);
          data[i + 3] = Math.round((1 - fade) * data[i + 3]);
        }
      }

      camChromaCtx.putImageData(imageData, 0, 0);

      // Draw background behind (destination-over compositing)
      camChromaCtx.globalCompositeOperation = "destination-over";
      if (chromaBgIsVideo && chromaBgVideo && chromaBgVideo.readyState >= 2) {
        camChromaCtx.drawImage(chromaBgVideo, 0, 0, w, h);
      } else if (chromaBgImg && chromaBgImg.complete && chromaBgImg.naturalWidth > 0) {
        camChromaCtx.drawImage(chromaBgImg, 0, 0, w, h);
      }
      camChromaCtx.globalCompositeOperation = "source-over";

      camChromaLoopId = requestAnimationFrame(chromaKeyLoop);
    }

    function setChromaBackground(src, opts) {
      chromaBgDataUrl = src || "";
      /* A blob: URL says nothing about its contents, unlike a data: URL or a
         filename, so the caller passes the type explicitly. The old sniffing
         stays as the fallback for any caller that does not. */
      const o = opts || {};
      chromaBgIsVideo = !!src && (
        typeof o.isVideo === "boolean"
          ? o.isVideo
          : (String(src).startsWith("data:video/") ||
             /\.(mp4|webm|mov|avi|mkv)$/i.test(String(src)))
      );

      if (dataUrl) {
        if (chromaBgIsVideo) {
          if (chromaBgImg) chromaBgImg.src = "";
          if (chromaBgVideo) {
            chromaBgVideo.src = dataUrl;
            chromaBgVideo.play().catch(() => {});
          }
        } else {
          if (chromaBgVideo) {
            chromaBgVideo.pause();
            chromaBgVideo.src = "";
          }
          if (chromaBgImg) chromaBgImg.src = dataUrl;
        }
        // Enable chroma key mode
        setChromaEnabled(true);
        // Start camera if not running
        if (!isStreamActive()) startCamera();
      } else {
        // Clear background
        if (chromaBgImg) chromaBgImg.src = "";
        if (chromaBgVideo) {
          chromaBgVideo.pause();
          chromaBgVideo.src = "";
        }
        setChromaEnabled(false);
      }
    }

    function setChromaEnabled(next) {
      camChromaEnabled = !!next;
      if (camChromaCanvas) camChromaCanvas.style.display = camChromaEnabled ? "block" : "none";
      if (camChromaCtx && !camChromaEnabled) camChromaCtx.clearRect(0, 0, camChromaCanvas.width, camChromaCanvas.height);
      if (camChromaEnabled) {
        resizeChromaCanvas();
        if (!camChromaLoopId) chromaKeyLoop();
        // Start camera if not running
        if (!isStreamActive()) startCamera();
      } else if (camChromaLoopId) {
        cancelAnimationFrame(camChromaLoopId);
        camChromaLoopId = null;
      }
      applyCamVisibility();
    }

    function setVrmEnabled(next) {
      camVrmEnabled = !!next;
      if (camVrmCanvas) camVrmCanvas.style.display = camVrmEnabled ? "block" : "none";
      if (window.VRMController && typeof window.VRMController.enable === "function") {
        window.VRMController.enable(camVrmEnabled);
      }
      // If VRM is turned off while background is active, stop camera stream
      const hasBgActive = (camBgEl && camBgEl.style.display !== "none") || (camBgVideoEl && camBgVideoEl.style.display !== "none");
      if (!camVrmEnabled && hasBgActive) {
        if (stream) {
          try { stream.getTracks().forEach((track) => track.stop()); } catch (err) { /* ignore */ }
          stream = null;
          if (videoEl) videoEl.srcObject = null;
        }
      } else if (camVrmEnabled && !isStreamActive()) {
        startCamera();
      }
      applyCamVisibility();
    }

    // Friendly "camera unavailable" message, shown only when the live camera is
    // the layer that *should* be visible (no bg / no VRM avatar / cam on).
    let camStatusMsg = "";
    function setCamStatus(msg) {
      camStatusMsg = msg || "";
      updateCamStatusVisibility();
    }
    function updateCamStatusVisibility() {
      const el = document.getElementById("camStatus");
      if (!el) return;
      const hasBg = !!(camBgEl && camBgEl.style.display !== "none" && camBgEl.src) || !!(camBgVideoEl && camBgVideoEl.style.display !== "none" && camBgVideoEl.src);
      const vrmActive = camVrmEnabled && !!(window.VRMController && typeof window.VRMController.isReady === "function" && window.VRMController.isReady());
      const cameraIsActiveLayer = camVisible && !hasBg && !vrmActive && !camSegEnabled && !camChromaEnabled;
      el.textContent = camStatusMsg;
      el.hidden = !(camStatusMsg && cameraIsActiveLayer);
    }

    function applyCamVisibility() {
      updateCamStatusVisibility();
      const wrap = document.getElementById('videoWrap');
      /* A background counts as present if it's already on screen OR is configured
         on this device (localStorage marker) but still loading. The marker check
         is what stops the host's face from flashing on a hard refresh before the
         bg video finishes loading — the camera stays hidden the whole time. */
      let bgConfigured = false;
      try { const _mk = localStorage.getItem(camBgStoreKey) || ""; bgConfigured = !!_mk && _mk !== CAM_BG_NONE; } catch (e) { /* ignore */ }
      const hasBg = bgConfigured || !!(camBgEl && camBgEl.style.display !== "none" && camBgEl.src) || !!(camBgVideoEl && camBgVideoEl.style.display !== "none" && camBgVideoEl.src);
      if (!camVisible) {
        videoEl.style.opacity = "0";
        if (wrap) {
          wrap.style.visibility = "";
          // Cam off WITH a background → keep the background visible, hide only
          // the live camera. Cam off WITHOUT a background → hide everything.
          if (hasBg) {
            wrap.classList.add("cam-bg-only");
            wrap.classList.remove("cam-hidden");
          } else {
            wrap.classList.add("cam-hidden");
            wrap.classList.remove("cam-bg-only");
          }
          wrap.classList.remove("cam-speaking");
        }
        return;
      }
      if (wrap) {
        wrap.style.visibility = "";
        wrap.classList.remove("cam-hidden");
        wrap.classList.remove("cam-bg-only");
      }
      if (hasBg) {
        videoEl.style.opacity = "0";
        return;
      }
      // VRM only hides the live camera when an avatar is actually loaded —
      // otherwise an enabled-but-empty VRM would leave a black screen.
      const vrmActive = camVrmEnabled
        && !!(window.VRMController && typeof window.VRMController.isReady === "function" && window.VRMController.isReady());
      if (vrmActive || camSegEnabled || camChromaEnabled) {
        videoEl.style.opacity = "0";
      } else {
        videoEl.style.opacity = "1";
      }
    }

    // Re-evaluate cam visibility when a VRM avatar finishes loading or fails.
    window.addEventListener("vrm-ready-change", () => { try { applyCamVisibility(); } catch (e) { /* ignore */ } });

    function setCamVisible(next) {
      camVisible = !!next;
      if (camVisible) {
        if (!isStreamActive()) startCamera();
        else ensureVideoStreamAttached();
      } else if (!camVrmEnabled && stream) {
        /* Cam turned OFF → actually release the webcam so the MacBook camera
           light goes out. (VRM keeps the stream because it needs the feed for
           face tracking.) The cam background, if any, stays visible. */
        try { stream.getTracks().forEach((t) => t.stop()); } catch (e) { /* ignore */ }
        stream = null;
        if (videoEl) videoEl.srcObject = null;
      }
      // If a background video is present, make sure it is actually playing so
      // turning the cam off shows the background instead of a black frame.
      if (!camVisible && camBgVideoEl && camBgVideoEl.style.display !== "none" && camBgVideoEl.src) {
        camBgVideoEl.play().catch(() => {});
      }
      applyCamVisibility();
    }

    function applyCamToolsVisibility() {

      if (chromaBgBtn) chromaBgBtn.style.display = camToolsVisible ? "" : "none";
      if (chromaBgClearBtn) chromaBgClearBtn.style.display = camToolsVisible ? "" : "none";
      if (webBgBtn) webBgBtn.style.display = webBgToolsVisible ? "" : "none";
      if (webBgClearBtn) webBgClearBtn.style.display = webBgToolsVisible ? "" : "none";
      const dShow = decorateToolsVisible ? "" : "none";

      const decorAddTextBtnEl   = document.getElementById("decorAddTextBtn");
      const decorEditModeBtnEl  = document.getElementById("decorEditModeBtn");
      const decorClearAllBtnEl  = document.getElementById("decorClearAllBtn");
      if (decorUploadMediaBtn) decorUploadMediaBtn.style.display = dShow;
      if (decorAddTextBtnEl)   decorAddTextBtnEl.style.display   = dShow;

    function setCamToolsVisible(next) {

    function setWebBgToolsVisible(next) {

    // ── Decorate button handlers (appear in camTools when Decorate: On) ──
    /* Decorate media is kept on THIS DEVICE, exactly like the cam background
       and seat videos already are (see mediaStore / restoreCamBgFromLocal).
       The file goes straight into IndexedDB and plays from an object URL.

       Nothing is uploaded, so there is no size ceiling and no re-encode: the
       video plays at the quality it was made at. The previous route base64'd
       the file into a JSON body our server had to buffer — that buffer is what
       capped the size — and then had Cloudinary re-encode it to 720x1280 at
       800k, which is why a carefully prepared upload still looked soft.

       The trade-off is that the blob belongs to this browser profile. The
       layout still records the item, but opening that layout on another
       machine cannot show media that machine does not have. */
    const DECOR_MEDIA_PREFIX = "decor-media-";
    const decorBlobUrls = new Map(); // decor id -> object URL

    function decorBlobUrlFor(id, blob) {
      const prev = decorBlobUrls.get(id);
      if (prev) { try { URL.revokeObjectURL(prev); } catch (e) { /* ignore */ } }
      const url = URL.createObjectURL(blob);
      decorBlobUrls.set(id, url);
      return url;
    }

    async function saveDecorMediaLocal(id, file) {
      await mediaStore.set(DECOR_MEDIA_PREFIX + id, file);
      return decorBlobUrlFor(id, file);
    }

    /* Returns the item with a usable blob URL, or null when this device does
       not hold the media (layout copied from another machine). */
    async function resolveDecorMedia(item) {
      if (!item || !item.localMedia) return item;
      try {
        const blob = await mediaStore.get(DECOR_MEDIA_PREFIX + item.id);
        if (blob) return Object.assign({}, item, { url: decorBlobUrlFor(item.id, blob) });
        console.warn("Decorate media not on this device:", item.id);
      } catch (err) {
        console.warn("Decorate media lookup failed:", err);
      }
      return null;
    }

    async function deleteDecorMediaLocal(id) {
      const prev = decorBlobUrls.get(id);
      if (prev) { try { URL.revokeObjectURL(prev); } catch (e) { /* ignore */ } }
      decorBlobUrls.delete(id);
      try { await mediaStore.del(DECOR_MEDIA_PREFIX + id); } catch (e) { /* ignore */ }
    }

    function normalizeSeats(rawSeats) {
      const arr = Array.isArray(rawSeats) ? rawSeats.slice(0, seatCount) : [];
      while (arr.length < seatCount) arr.push(null);
      return arr;
    }

    function loadSeats() {
      try {
        const saved = localStorage.getItem(seatsStoreKey);
        if (!saved) {
          /* First-run default: first seat preloaded with @or1mirlive and a
             built-in video file. */
          seats[0] = {
            handle: "@or1mirlive",
            name: "@or1mirlive",
            avatar: "",
            points: 0,
            videoMode: true,
            videoSrc: "image/savetik.MP4",
          };
          seatColors = Array.from({ length: seatCount }, () => null);
          return;
        }
        const parsed = JSON.parse(saved);
        if (Array.isArray(parsed)) {
          seats = normalizeSeats(parsed);
          seatColors = Array.from({ length: seatCount }, () => null);
          seats.forEach((seat, idx) => {

    function crLoadState() {
      try {
        const raw = localStorage.getItem("tiktok-custom-reward");

          if (p && Array.isArray(p.rows)) return { enabled: p.enabled !== false, rows: p.rows, showName: p.showName === true, arrowMedia: p.arrowMedia || "", arrowType: p.arrowType || "" };
        }

      return crDefaultRewardState();
    }

    function crRowEl(row) {
      const el = document.createElement("div");
      el.className = "cr-box-row";
      const showName = customRewardState.showName === true;
      const addGift = (gift) => {
        const img = document.createElement("img");
        img.className = "cr-box-ico"; img.alt = "";
        if (gift && gift.icon) img.src = gift.icon;
        el.appendChild(img);
        // Gift name is optional (toggled from Mode 2 — default off).
        if (showName) {
          const nm = document.createElement("span");
          nm.className = "cr-box-name";
          nm.textContent = gift && gift.name ? gift.name : "—";
          el.appendChild(nm);
        }
      };
      addGift(row && row.trigger);
      // Arrow: a custom uploaded image/gif/video (from Mode 2), else the default ➜.
      if (customRewardState.arrowMedia) {
        let am;
        if (customRewardState.arrowType === "video") {
          am = document.createElement("video");
          am.src = customRewardState.arrowMedia;
          am.autoplay = true; am.loop = true; am.muted = true; am.playsInline = true;
        } else {
          am = document.createElement("img");
          am.src = customRewardState.arrowMedia; am.alt = "";
        }
        am.className = "cr-box-arrow cr-box-arrow-media";
        el.appendChild(am);
      } else {
        const ar = document.createElement("span");
        ar.className = "cr-box-arrow"; ar.textContent = "➜";
        el.appendChild(ar);
      }
      addGift(row && row.reward);
      return el;
    }

    function crVisibleRows() {
      const rows = Array.isArray(customRewardState.rows) ? customRewardState.rows : [];
      return rows.filter((r) => r && (r.trigger || r.reward));
    }

    function renderCustomReward() {
      if (!customRewardBox) return;
      const track = document.getElementById("customRewardTrack");
      const rows = crVisibleRows();
      const show = (customRewardState.enabled && rows.length > 0) || editMoveEnabled;
      customRewardBox.classList.toggle("cr-show", show);
      customRewardBox.setAttribute("aria-hidden", show ? "false" : "true");
      if (crBoxTimer) { clearInterval(crBoxTimer); crBoxTimer = null; }
      crRolling = false;
      if (!track) return;
      track.className = "cr-box-track";
      track.style.transform = "";
      track.innerHTML = "";
      if (!rows.length) {
        if (editMoveEnabled) {
          const ph = document.createElement("div");
          ph.className = "cr-box-row";
          const nm = document.createElement("span");
          nm.className = "cr-box-name";
          nm.textContent = "No rewards yet";
          ph.appendChild(nm);
          track.appendChild(ph);
        }
        return;
      }
      crBoxIndex = crBoxIndex % rows.length;
      track.appendChild(crRowEl(rows[crBoxIndex]));
      if (rows.length > 1 && customRewardState.enabled) {
        crBoxTimer = setInterval(crAdvanceCustomReward, 3500);
      }
    }

    function crAdvanceCustomReward() {
      const track = document.getElementById("customRewardTrack");
      const rows = crVisibleRows();
      if (!track || crRolling || rows.length < 2) return;
      const nextIndex = (crBoxIndex + 1) % rows.length;
      track.className = "cr-box-track";
      track.style.transform = "";
      track.innerHTML = "";
      track.appendChild(crRowEl(rows[crBoxIndex]));
      track.appendChild(crRowEl(rows[nextIndex]));
      void track.offsetHeight;
      crRolling = true;
      track.classList.add("cr-rolling");
      const done = () => {
        track.removeEventListener("transitionend", done);
        crBoxIndex = nextIndex;
        crRolling = false;
        track.classList.remove("cr-rolling");
        track.style.transform = "";
        track.innerHTML = "";
        track.appendChild(crRowEl(rows[crBoxIndex]));
      };
      track.addEventListener("transitionend", done);
    }

    function handleIncoming(message) {
      if (!message || typeof message !== "object") return;
      if (!shouldProcessMessage(message)) return;
      if (message.type === "mode1-replaced") {
        /* This screen just lost the single-mode1 claim to a newer login
           elsewhere. The server already destroyed this session — leave. */
        redirectToPortal();
        return;
      }
      if (message.type === "remote-command") {
        if (message.action === "open-room") updateRoomUI(true);
        if (message.action === "close-room") updateRoomUI(false);
        if (message.action === "start-camera") startCamera();
        if (message.action === "toggle-mic") {
          micEnabled = !!message.enabled;
          if (stream) {
            const audioTracks = stream.getAudioTracks();
            if (micEnabled && audioTracks.length === 0) {
              startCamera();
            } else if (!micEnabled) {
              audioTracks.forEach((t) => t.stop());
              stopMicMonitor();
            }
          }
        }
        if (message.action === "set-transparent-bg") {
          document.body.classList.toggle("transparent-bg", !!message.enabled);
        }
      } else if (message.type === "edit-mode" && typeof message.enabled === "boolean") {
        editMoveEnabled = message.enabled;
        updateCamBgEditUpload();
        applyEditOutlines();
        if (animationBox) {
          animationBox.style.borderStyle = message.enabled ? "dashed" : "none";
        }
        if (fireworkBox) {
          fireworkBox.style.borderStyle = message.enabled ? "dashed" : "none";
          fireworkBox.style.pointerEvents = message.enabled ? "auto" : "none";
        }
        if (giftSenderCapsule) {
          const _inner = giftSenderCapsule.querySelector(".gift-sender-capsule-inner");
          if (message.enabled) {
            // Show capsule in edit mode so user can position it
            if (_inner) { _inner.classList.remove("capsule-slide-in", "capsule-slide-out"); }
            giftSenderCapsule.style.display = "";
            giftSenderCapsule.classList.add("edit-capsule");
            giftSenderCapsule.style.pointerEvents = "auto";
            if (giftCapsuleHideTimer) { clearTimeout(giftCapsuleHideTimer); giftCapsuleHideTimer = null; }
          } else {
            giftSenderCapsule.classList.remove("edit-capsule");
            giftSenderCapsule.style.pointerEvents = "none";
            if (_inner) { _inner.classList.remove("capsule-slide-in", "capsule-slide-out"); }
            giftSenderCapsule.style.display = "none";
          }
        }
        if (giftReceivedCard) {
          const _grInner = giftReceivedCard.querySelector(".gift-received-inner");
          if (message.enabled) {
            // Show the GIFT RECEIVED card in edit mode so the user can position/resize it
            if (_grInner) { _grInner.classList.remove("gr-slide-in", "gr-slide-out"); }
            // Populate a sample profile so the card is meaningful while editing
            const _grSample = resolveGiftProfile(-1) || (liveHostProfile && (liveHostProfile.name || liveHostProfile.avatar) ? liveHostProfile : null) || { name: "Supporter", avatar: "", username: "" };
            const _grDefAv = "data:image/svg+xml," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%238b93a6"><circle cx="12" cy="8" r="4"/><path d="M20 21a8 8 0 10-16 0"/></svg>');
            if (giftReceivedAvatar && !giftReceivedAvatar.getAttribute("src")) giftReceivedAvatar.src = _grSample.avatar || _grDefAv;
            if (giftReceivedName && !giftReceivedName.textContent) giftReceivedName.textContent = _grSample.name || "Supporter";
            giftReceivedCard.classList.add("gr-active", "edit-card");
            giftReceivedCard.style.pointerEvents = "auto";
            if (giftReceivedHideTimer) { clearTimeout(giftReceivedHideTimer); giftReceivedHideTimer = null; }
          } else {
            giftReceivedCard.classList.remove("edit-card");
            giftReceivedCard.style.pointerEvents = "none";
            if (_grInner) { _grInner.classList.remove("gr-slide-in", "gr-slide-out"); }
            if (!giftReceivedHideTimer) giftReceivedCard.classList.remove("gr-active");
          }
        }
        if (customRewardBox) {
          if (message.enabled) {
            customRewardBox.classList.add("edit-card");
            customRewardBox.style.pointerEvents = "auto";
          } else {
            customRewardBox.classList.remove("edit-card");
            customRewardBox.style.pointerEvents = "none";

        } else {
          resetEditZOrder();
          if (typeof window.__clearGroupSelection === "function") window.__clearGroupSelection();
          if (window.__editLayoutToggles) window.__editLayoutToggles.hide();
        }
      } else if (message.type === "save-layout") {
        // Save to MongoDB only (no localStorage)
        saveLayoutToServer();
        console.log("Layout saved to MongoDB");
      } else if (message.type === "clear-decorations") {
        if (typeof window.decorClearAll === "function") window.decorClearAll();
        /* Reset Layout means "back to defaults", not "empty", so put the
           starting decorations back. decorClearAll frees their device-local
           media first, so this re-seeds onto a clean layer. */
        if (message.reseed !== false) {
          seedDefaultDecorations();
          try { localStorage.setItem(DECOR_DEFAULT_BANNER_KEY, "added"); } catch (e) { /* ignore */ }
        }
      } else if (message.type === "custom-reward-config" && message.config && Array.isArray(message.config.rows)) {
        customRewardState = { enabled: message.config.enabled !== false, rows: message.config.rows, showName: message.config.showName === true, arrowMedia: message.config.arrowMedia || "", arrowType: message.config.arrowType || "" };
        try { localStorage.setItem("tiktok-custom-reward", JSON.stringify(customRewardState)); } catch (err) { /* ignore */ }
        crBoxIndex = 0;
        renderCustomReward();
      } else if (message.type === "remote-style" && message.style) {
        const { _v, uiEditMoveEnabled, uiRoomOpen, uiCamVisible, uiHostTextVisible, uiCamNameVisible, uiSpeakingBorderVisible, uiCamToolsOn, uiTransparentBgOn, uiUploadBgToolOn, ...rest } = message.style;
        roomStyle = { ...roomStyle, ...rest };
        /* A payload that OMITS the style-6/7 drag keys (Reset Layout sends
           bare defaults) must clear them — the merge above kept stale values,
           so Style 7 stayed sunk at the bottom even right after a reset. */
        ["style6Y", "style6LeftDX", "style6RightDX", "style6GapW", "style6SeatScale", "style6CamOffsetX", "style7CamY", "style7CamH", "style7AnimManual", "style7AnimX", "style7AnimY", "style7AnimW", "style7AnimH"].forEach((k) => {
          if (!(k in rest)) delete roomStyle[k];

        // Apply UI toggle states from mode2
        applyUIState(message.style);

            roomStyle[activePrefix + "Height"] = nextH;

      let resizeRight = false;
      let resizeTop = false;
      let resizeBottom = false;

        el.addEventListener("pointerdown", (e) => {
        if (!editMoveEnabled) return;

        resizeRight = e.clientX >= rect.right - edge;
        resizeTop = e.clientY <= rect.top + edge;
        resizeBottom = e.clientY >= rect.bottom - edge;

        startY = e.clientY;

        startH = (keyPrefix === "cam" && seatStyleMode === 7) ? (Number(roomStyle.style7CamH) || el.offsetHeight)

          ? (Number(roomStyle.style7CamY) || 0)
          : keyPrefix === "cam" && seatStyleMode === 3
            ? (Number(roomStyle.style3CamOffsetY) || 0)
            : (roomStyle[oKey("OffsetY")] ?? 0);

            ? (roomStyle.roomScale2 ?? 100)

                : (roomStyle.roomScale1 ?? 100);
        } else if (keyPrefix === "giftCapsule" || keyPrefix === "giftReceived" || keyPrefix === "customReward") {

      // Pinch-to-resize for touch devices

      /* ── Group multi-select adapter ──────────────────────────────────────

        el,
        keyPrefix,

        _s: null,
        getRect() { return el.getBoundingClientRect(); },

        setScaleFactor(f) {

          } else if (s.usesScale) {
            const ns = Math.min(300, Math.max(20, Math.round(s.scale * f)));

            else if (keyPrefix === "giftReceived") roomStyle.giftReceivedScale = ns;
            else roomStyle.giftCapsuleScale = ns;
          } else {
            const ap = resolveKeyPrefix();

            const nh = Math.max(minHeight, Math.round(s.h * f));

            roomStyle[ap + "Height"] = nh;

    function initChannel() {

    loadSeats();
    // Load layout from MongoDB only (no localStorage fallback)
    (async function loadSavedLayout() {

      applyRoomStyle();
      updateRoomUI(roomOpen);
    })();

    enableDragResize(roomPanel, "room");
    enableDragResize(animationBox, "animation");
    enableDragResize(fireworkBox, "firework");

    if (giftReceivedCard) enableDragResize(giftReceivedCard, "giftReceived");
    if (customRewardBox) enableDragResize(customRewardBox, "customReward");

    /* ── Style 6: per-column seat drag + edge resize ──
       In Edit Move, on a seat:
       • dragging the MIDDLE horizontally moves ONLY its own column (left =

      roomGrid.addEventListener("pointerdown", (e) => {

        if (e.pointerType === "mouse" && e.button !== 0) return;

          const startScale = Math.min(300, Math.max(30, Number(roomStyle.style6SeatScale) || 100));
          const startL = Number(roomStyle.style6LeftDX) || 0;
          const startR = Number(roomStyle.style6RightDX) || 0;
          const startYY = Number(roomStyle.style6Y) || 0;

            roomPanel.style.outlineOffset = "2px";

            if (nearL) {

              roomStyle.style6RightDX = Math.round(startR - rect.width * growth);

            window.removeEventListener("pointerup", onUp);
          };

          window.addEventListener("pointerup", onUp);

        const slotIdx = [...roomGrid.querySelectorAll(".slot")].indexOf(slotEl);
        const isLeft = slotIdx >= 0 && slotIdx < 4;
        const k = isLeft ? "style6LeftDX" : "style6RightDX";
        const ox = Number(roomStyle[k]) || 0;
        const oy = Number(roomStyle.style6Y) || 0;
        const onMove = (ev) => {
          ev.preventDefault();
          roomStyle[k] = Math.round(ox + (ev.clientX - sx));        // column X

          window.removeEventListener("pointerup", onUp);
        };
        window.addEventListener("pointermove", onMove);
        window.addEventListener("pointerup", onUp);
      });
    }

    /* ── Group multi-select tool ─────────────────────────────────────────

       layout box it touches. Drag inside the selection to move the whole

      gbox.className = "group-bbox";
      gbox.style.display = "none";

          if (!a.isVisible()) continue;
          const r = a.getRect();

      }

          const q = a.getRect();
          l = Math.min(l, q.left); t = Math.min(t, q.top);
          r = Math.max(r, q.right); b = Math.max(b, q.bottom);

        if (!gr) { gbox.style.display = "none"; return; }
        const hr = host.getBoundingClientRect();
        gbox.style.display = "block";
        gbox.style.left = (gr.left - hr.left) + "px";
        gbox.style.top = (gr.top - hr.top) + "px";
        gbox.style.width = gr.width + "px";
        gbox.style.height = gr.height + "px";

        selection.forEach((a) => a.el.classList.remove("group-selected"));

        gbox.style.display = "none";
        window.__groupSelEls = null;

          const w = Math.abs(x - op.sx), h = Math.abs(y - op.sy);
          marquee.style.left = (l - hr.left) + "px";
          marquee.style.top = (t - hr.top) + "px";
          marquee.style.width = w + "px";
          marquee.style.height = h + "px";

        } else if (op.type === "move") {
          const dx = x - op.sx, dy = y - op.sy;
          op.items.forEach((it) => it.a.moveByScreen(dx, dy));
          applyRoomStyle();
          if (typeof broadcastCurrentStyle === "function") broadcastCurrentStyle("host-group-move");

          gbox.style.top = (op.gb.top - hr.top + dy) + "px";

          op.items.forEach((it) => {

              const top = nearT && !nearB, bottom = nearB;

          clearSelection(); // clicked away from the group → unselect
        }

        const hit = adapterAtPoint(x, y);
        if (!hit) {
          // Empty space → begin a marquee selection.
          e.preventDefault(); e.stopPropagation();
          const hr = host.getBoundingClientRect();
          marquee.style.display = "block";
          marquee.style.left = (x - hr.left) + "px";
          marquee.style.top = (y - hr.top) + "px";
          marquee.style.width = "0px";
          marquee.style.height = "0px";
          startOp({ type: "marquee", sx: x, sy: y, rect: { left: x, top: y, right: x, bottom: y } });
          return;
        }
        // Clicked an unselected box → let its own single drag/resize run.
      }, true);

      window.addEventListener("resize", () => { if (selection.size) updateGroupBox(); });
    })();

    customRewardState = crLoadState();
    renderCustomReward();

    /* ── Per-layout On/Off setters (also keep Mode 2's toggles in sync) ── */
    function setGiftCapsuleVisible(on) {
      giftCapsuleVisible = !!on;
      if (giftSenderCapsule && !giftCapsuleVisible && !editMoveEnabled) giftSenderCapsule.style.display = "none";
      debounceSaveLayout();
      sendMessage({ type: "host-ui-toggle", key: "giftCapsule", on: giftCapsuleVisible });
    }
    function setGiftReceivedVisible(on) {
      giftReceivedVisible = !!on;
      if (giftReceivedCard && !giftReceivedVisible && !editMoveEnabled) {
        if (giftReceivedHideTimer) { clearTimeout(giftReceivedHideTimer); giftReceivedHideTimer = null; }
        giftReceivedCard.classList.remove("gr-active");
      }
      debounceSaveLayout();
      sendMessage({ type: "host-ui-toggle", key: "giftReceived", on: giftReceivedVisible });
    }
    function setFireworkEnabled(on) {
      fireworkEnabled = !!on;
      debounceSaveLayout();
    }
    function setCustomRewardEnabledState(on) {
      customRewardState.enabled = !!on;
      try { localStorage.setItem("tiktok-custom-reward", JSON.stringify(customRewardState)); } catch (e) { /* ignore */ }
      renderCustomReward();
      sendMessage({ type: "host-ui-toggle", key: "customReward", on: customRewardState.enabled });
    }

    /* ── Edit-mode On/Off toggle chips, anchored at each layout's top-left ──
       Overlay buttons (not children of the boxes, so they don't scale with
       them). Only shown while edit mode is on; they follow the boxes live. */
    (function initEditLayoutToggles() {
      const host = document.getElementById("hostLayout");
      if (!host) return;
      const defs = [
        { el: giftSenderCapsule, label: "Gift Capsule", get: () => giftCapsuleVisible, set: setGiftCapsuleVisible },
        { el: giftReceivedCard, label: "Gift Card", get: () => giftReceivedVisible, set: setGiftReceivedVisible },
        { el: fireworkBox, label: "Firework", get: () => fireworkEnabled, set: setFireworkEnabled },
        { el: customRewardBox, label: "Custom Reward", get: () => !!customRewardState.enabled, set: setCustomRewardEnabledState },
      ];
      const toggles = [];
      defs.forEach((d) => {
        if (!d.el) return;
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "edit-layout-toggle";
        btn.style.display = "none";
        const sync = () => {
          const on = d.get();
          btn.textContent = d.label + ": " + (on ? "On" : "Off");
          btn.classList.toggle("is-off", !on);
        };
        btn.addEventListener("pointerdown", (e) => { e.stopPropagation(); });
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          d.set(!d.get());
          sync();
        });
        host.appendChild(btn);
        toggles.push({ d, btn, sync });
      });

      let rafId = null;
      function positionAll() {
        const hr = host.getBoundingClientRect();
        toggles.forEach(({ d, btn }) => {
          const r = d.el.getBoundingClientRect();
          const visible = r.width > 1 && r.height > 1 && getComputedStyle(d.el).display !== "none";
          if (!visible) { btn.style.display = "none"; return; }
          btn.style.display = "block";
          btn.style.left = (r.left - hr.left) + "px";
          btn.style.top = (r.top - hr.top) + "px";
        });
        rafId = editMoveEnabled ? requestAnimationFrame(positionAll) : null;
      }

      window.__editLayoutToggles = {
        show() { toggles.forEach((t) => t.sync()); if (!rafId) positionAll(); },
        hide() { if (rafId) { cancelAnimationFrame(rafId); rafId = null; } toggles.forEach((t) => { t.btn.style.display = "none"; }); },
        sync() { toggles.forEach((t) => t.sync()); },
      };
    })();

    initChannel();

    // ─── Decorate Overlay ──────────────────────────────────────────────
    /* Decorate overlay moved to js/decor.js (window.App.decor / window.decor*). */

    // Preload speech synthesis voices so they're ready for TTS commands
    if (window.speechSynthesis) window.speechSynthesis.getVoices();
    // preloadGiftAssets is called after requireLogin succeeds
    // After init, broadcast mode1's actual layout so mode2 sliders stay in sync
    setTimeout(() => broadcastCurrentStyle("host-init"), 500);
    try {
      const savedFacing = localStorage.getItem(camFacingStoreKey);
      if (savedFacing === "user" || savedFacing === "environment") currentFacingMode = savedFacing;
    } catch (err) { /* ignore */ }
    try {
      if (!camBgLoadedFromServer) {
        // Show this device's saved background quickly; the login path will
        // re-confirm once the session resolves. Default video if nothing saved.
        restoreCamBgFromLocal().then((restored) => {
          if (!restored && !camBgLoadedFromServer) applyDefaultCamBgVideo();
        });
      }
    } catch (err) { /* ignore */ }
    restoreWebBgFromLocal().catch(() => setWebBackground(defaultWebBgUrl, false));
    /* PRIVACY: if a cam background is configured on this device, force the cam
       OFF at startup so the host's face can never flash before the background
       loads. The background replaces the camera anyway. (CAM_BG_NONE means the
       host explicitly chose "live camera, no background" — that's allowed on.) */
    try {
      const _bgMarker = localStorage.getItem(camBgStoreKey) || "";
      if (_bgMarker && _bgMarker !== CAM_BG_NONE) camVisible = false;
    } catch (e) { /* ignore */ }
    /* Only power on the webcam at startup if the cam is actually on (or VRM
       needs the feed). With the cam defaulting to OFF, this keeps the MacBook
       camera light off until the host turns the camera on. */
    if (camVisible || camVrmEnabled) startCamera();
    applyCamVisibility();
    startMicMonitor();
    positionGiftOverlay();
    window.addEventListener("resize", positionGiftOverlay);
    window.addEventListener("resize", applyRoomStyle);
    if (preferredMode === "host") {
      // already in host mode
    }
  </script>
</body>
